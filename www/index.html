<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>OMNITRIX // Voxel Protocol</title>
<style>
  :root{
    --green:#39ff8a; --green-dim:#1c7a45; --panel:#0b1210ee; --panel2:#0e1a16dd;
    --danger:#ff4444; --energy:#28b7ff; --edge:#122b1e;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;
    font-family:'Segoe UI',Roboto,Consolas,monospace;}
  canvas{display:block;touch-action:none;}

  /* ---------- START MENU ---------- */
  #start-screen{
    position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 30%, #10251a 0%, #050807 70%);color:#eafff2;
    padding:env(safe-area-inset-top,16px) 20px env(safe-area-inset-bottom,16px);
  }
  #start-screen h1{
    font-size:30px;letter-spacing:4px;margin:0 0 4px;color:var(--green);
    text-shadow:0 0 16px rgba(57,255,138,0.6);
  }
  #start-screen .sub{opacity:0.6;font-size:12px;letter-spacing:2px;margin-bottom:26px;}
  .menu-btn{
    width:230px;padding:13px 0;margin:6px 0;background:linear-gradient(180deg,#12261c,#0a140f);
    border:1px solid var(--green-dim);color:var(--green);font-size:15px;letter-spacing:2px;
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  }
  .menu-btn:active{background:#183a26;}
  #menu-panel{display:none;max-width:340px;font-size:13px;line-height:1.6;opacity:0.85;text-align:center;margin-top:14px;}
  #menu-panel.show{display:block;}
  #quality-row{display:flex;gap:8px;justify-content:center;margin-top:8px;}
  .qbtn{padding:6px 14px;border:1px solid var(--green-dim);color:#9fe;background:#0a140f;font-size:12px;letter-spacing:1px;}
  .qbtn.active{background:var(--green-dim);color:#fff;}

  /* ---------- HUD ---------- */
  #hud{position:fixed;z-index:20;pointer-events:none;inset:0;display:none;}
  #alien-card{
    position:absolute;top:max(14px,env(safe-area-inset-top,14px));left:14px;
    width:190px;background:var(--panel);border:1px solid var(--green-dim);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%);
    padding:8px 10px 10px;pointer-events:auto;touch-action:none;
  }
  #alien-portrait-wrap{display:flex;align-items:center;gap:8px;}
  #alien-portrait{
    width:46px;height:46px;border:1px solid var(--green);background:#081b12;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;overflow:hidden;
  }
  #alien-portrait canvas{width:100%;height:100%;}
  #alien-name{font-size:13px;letter-spacing:1px;color:var(--green);font-weight:700;line-height:1.2;}
  #alien-hint{font-size:9px;opacity:0.45;letter-spacing:0.5px;margin-top:1px;}
  .bar-row{display:flex;align-items:center;gap:5px;margin-top:6px;}
  .bar-label{font-size:9px;width:16px;opacity:0.7;letter-spacing:1px;}
  .bar-track{flex:1;height:7px;background:#050a07;border:1px solid #1c2b22;position:relative;}
  .bar-fill{height:100%;width:100%;transition:width 0.15s linear;}
  #health-fill{background:linear-gradient(90deg,#ff5555,#ff9955);}
  #energy-fill{background:linear-gradient(90deg,#1c8fff,#39ffe0);}

  #alien-banner{
    position:absolute;top:80px;left:50%;transform:translateX(-50%);
    color:var(--green);font-size:20px;letter-spacing:4px;text-shadow:0 0 12px rgba(57,255,138,0.8);
    opacity:0;transition:opacity 0.25s;
  }
  #alien-banner.show{opacity:1;}

  #flash-overlay{position:fixed;inset:0;background:var(--green);opacity:0;pointer-events:none;z-index:60;}
  #damage-overlay{position:fixed;inset:0;pointer-events:none;z-index:55;
    box-shadow:inset 0 0 120px 20px rgba(255,0,0,0);transition:box-shadow 0.2s;}

  #crosshair{position:fixed;top:50%;left:50%;width:14px;height:14px;transform:translate(-50%,-50%);
    z-index:15;pointer-events:none;}
  #crosshair::before,#crosshair::after{content:'';position:absolute;background:rgba(255,255,255,0.7);}
  #crosshair::before{top:50%;left:0;width:100%;height:1.5px;transform:translateY(-.75px);}
  #crosshair::after{left:50%;top:0;height:100%;width:1.5px;transform:translateX(-.75px);}

  #hotbar{position:absolute;bottom:max(10px,env(safe-area-inset-bottom,10px));left:50%;transform:translateX(-50%);
    display:flex;gap:5px;pointer-events:auto;touch-action:none;}
  .hotslot{width:38px;height:38px;background:var(--panel);border:1px solid #26402f;position:relative;}
  .hotslot.sel{border-color:var(--green);box-shadow:0 0 8px rgba(57,255,138,0.6);}
  .hotslot canvas{width:100%;height:100%;}

  #joystick-zone{position:absolute;left:max(20px,env(safe-area-inset-left,20px));
    bottom:max(20px,env(safe-area-inset-bottom,20px));width:120px;height:120px;pointer-events:auto;}
  #joystick-base{position:absolute;inset:0;border-radius:50%;background:rgba(30,60,45,0.35);border:2px solid rgba(57,255,138,0.35);}
  #joystick-stick{position:absolute;width:50px;height:50px;border-radius:50%;background:rgba(57,255,138,0.35);
    border:2px solid rgba(57,255,138,0.6);left:50%;top:50%;transform:translate(-50%,-50%);}

  #cam-zone{position:absolute;right:0;top:0;bottom:130px;left:42%;pointer-events:auto;}

  #action-buttons{position:absolute;right:max(16px,env(safe-area-inset-right,16px));
    bottom:max(16px,env(safe-area-inset-bottom,16px));width:180px;height:150px;pointer-events:none;}
  .abtn{position:absolute;border-radius:50%;background:var(--panel);border:1.5px solid var(--green-dim);
    display:flex;align-items:center;justify-content:center;pointer-events:auto;transition:transform 0.08s,background 0.08s;}
  .abtn.active{transform:scale(0.88);background:#173a25;border-color:var(--green);}
  .abtn svg{width:50%;height:50%;stroke:var(--green);fill:none;stroke-width:2;}
  #btn-jump{width:64px;height:64px;right:0;bottom:0;}
  #btn-attack{width:74px;height:74px;right:74px;bottom:6px;}
  #btn-special{width:56px;height:56px;right:16px;bottom:82px;border-color:#1c6bb0;}
  #btn-special svg{stroke:var(--energy);}
  #btn-special.cooldown{opacity:0.35;}

  #status-text{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);color:#fff;font-size:12px;
    opacity:0;letter-spacing:1px;pointer-events:none;}
  #status-text.show{opacity:0.85;transition:opacity 0.2s;}

  #death-screen{position:fixed;inset:0;background:#000;z-index:70;display:none;align-items:center;justify-content:center;
    color:var(--danger);font-size:22px;letter-spacing:5px;}
  #actions{position:absolute;right:max(204px,calc(env(safe-area-inset-right,0px) + 204px));bottom:16px;width:118px;display:flex;flex-direction:row-reverse;flex-wrap:wrap-reverse;gap:8px;pointer-events:none;}
  .act{position:relative;width:54px;height:54px;font-size:9px;letter-spacing:.5px;color:var(--energy);text-align:center;line-height:1.1;border-color:#1c6bb0;}
  .act.cooldown{opacity:.35;}
  #slow-overlay{position:fixed;inset:0;pointer-events:none;z-index:50;opacity:0;transition:opacity .3s;box-shadow:inset 0 0 160px 40px rgba(40,183,255,.45);background:rgba(40,120,255,.08);}

  /* ---- game-style controls ---- */
  #hotbar{display:none !important;}
  #actions{z-index:20;}
  #actions{right:max(16px,env(safe-area-inset-right,16px));bottom:176px;width:128px;gap:8px;}
  .abtn{background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.4),rgba(255,255,255,0) 42%),linear-gradient(160deg,#23704a,#082014);
    border:3px solid #39ff8a;
    box-shadow:0 0 0 2px #03100a,0 0 16px rgba(57,255,138,.55),inset 0 -7px 10px rgba(0,0,0,.5),inset 0 4px 6px rgba(255,255,255,.25);}
  .abtn svg{stroke:#eafff2;stroke-width:2.4;filter:drop-shadow(0 0 4px #39ff8a);}
  .abtn.active{transform:scale(.88);filter:brightness(1.5);}
  #btn-attack{background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.4),rgba(255,255,255,0) 42%),linear-gradient(160deg,#c8481c,#3d0f04);
    border-color:#ffa04a;box-shadow:0 0 0 2px #100300,0 0 18px rgba(255,140,60,.65),inset 0 -8px 12px rgba(0,0,0,.5),inset 0 4px 6px rgba(255,255,255,.25);}
  #btn-attack svg{filter:drop-shadow(0 0 4px #ff8a3a);}
  #btn-special{background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.4),rgba(255,255,255,0) 42%),linear-gradient(160deg,#5a2fb8,#150838);
    border-color:#b48aff;box-shadow:0 0 0 2px #06021a,0 0 16px rgba(160,110,255,.6),inset 0 -6px 10px rgba(0,0,0,.5),inset 0 4px 6px rgba(255,255,255,.25);}
  #btn-special svg{stroke:#f1e8ff;filter:drop-shadow(0 0 4px #b48aff);}
  .act{width:58px;height:58px;border-radius:18px;flex-direction:column;gap:1px;color:#eaffff;
    background:radial-gradient(circle at 30% 18%,rgba(255,255,255,.45),rgba(255,255,255,0) 45%),linear-gradient(160deg,#1c8fd6,#08213f);
    border:3px solid #6fe3ff;
    box-shadow:0 0 0 2px #020b16,0 0 14px rgba(70,200,255,.6),inset 0 -7px 10px rgba(0,0,0,.5),inset 0 4px 6px rgba(255,255,255,.3);
    animation:actglow 2.2s ease-in-out infinite;}
  .act i{font-style:normal;font-size:21px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.6));}
  .act b{font-size:8px;letter-spacing:.8px;font-weight:800;text-shadow:0 1px 0 #000,0 0 6px rgba(0,0,0,.8);}
  .act.cooldown{filter:grayscale(.9) brightness(.55);animation:none;opacity:1;}
  @keyframes actglow{50%{box-shadow:0 0 0 2px #020b16,0 0 24px rgba(70,200,255,.95),inset 0 -7px 10px rgba(0,0,0,.5),inset 0 4px 6px rgba(255,255,255,.3);}}
  @media (max-height:430px){ #actions{bottom:158px;width:112px;} .act{width:50px;height:50px;} .act i{font-size:17px;} }
  #squad-panel{position:absolute;right:max(10px,env(safe-area-inset-right,10px));top:max(10px,env(safe-area-inset-top,10px));z-index:30;display:none;align-items:center;gap:5px;pointer-events:auto;flex-wrap:nowrap;}
  .chip{position:relative;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(10,18,15,.55);backdrop-filter:blur(3px);color:#cdeee0;font-size:10px;font-weight:800;letter-spacing:.2px;
    border:2px solid rgba(57,255,138,.55);}
  .chip::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:2px solid transparent;
    background:conic-gradient(#3aff8f calc(var(--hp,100)*1%),rgba(255,255,255,.12) 0) border-box;
    -webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;}
  .chip.sel{background:rgba(58,255,143,.28);border-color:#eafff2;box-shadow:0 0 10px rgba(57,255,138,.7);}
  .chip .hb,.chip .hf{display:none;}
  .chip.mode{width:auto;height:30px;padding:0 10px;border-radius:15px;font-size:9px;border-color:rgba(111,227,255,.5);color:#d8f4ff;}
  .chip.mode::after{display:none;}
  .chip.mode.on{background:rgba(28,143,214,.5);border-color:#6fe3ff;box-shadow:0 0 10px rgba(70,200,255,.7);}
  @media (orientation:portrait){ #squad-panel{top:242px;} }
</style>
</head>
<body>

<div id="start-screen">
  <h1>OMNITRIX</h1>
  <div class="sub">VOXEL PROTOCOL // PROTOTYPE BUILD</div>
  <button class="menu-btn" id="btn-start">START GAME</button>
  <button class="menu-btn" id="btn-controls">CONTROLS</button>
  <button class="menu-btn" id="btn-settings">SETTINGS</button>
  <button class="menu-btn" id="btn-about">ABOUT</button>
  <div id="menu-panel"></div>
</div>

<div id="hud">
  <div id="alien-card">
    <div id="alien-portrait-wrap">
      <div id="alien-portrait"></div>
      <div>
        <div id="alien-name">BEN</div>
        <div id="alien-hint">swipe portrait to switch</div>
      </div>
    </div>
    <div class="bar-row"><span class="bar-label">HP</span><div class="bar-track"><div id="health-fill" class="bar-fill"></div></div></div>
    <div class="bar-row"><span class="bar-label">EN</span><div class="bar-track"><div id="energy-fill" class="bar-fill"></div></div></div>
  </div>
  <div id="alien-banner"></div>
  <div id="actions"></div>
  <div id="squad-panel"></div>
  <div id="crosshair"></div>
  <div id="status-text"></div>

  <div id="hotbar"></div>
  <div id="joystick-zone"><div id="joystick-base"></div><div id="joystick-stick"></div></div>
  <div id="cam-zone"></div>

  <div id="action-buttons">
    <div class="abtn" id="btn-special"><svg viewBox="0 0 24 24"><path d="M13 2 L4 14 h6 l-1 8 9-12h-6z"/></svg></div>
    <div class="abtn" id="btn-attack"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M6 22v-4a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v4"/></svg></div>
    <div class="abtn" id="btn-jump"><svg viewBox="0 0 24 24"><path d="M12 4 l7 8h-4v8h-6v-8H5z"/></svg></div>
  </div>
</div>

<div id="flash-overlay"></div>
<div id="slow-overlay"></div>
<div id="damage-overlay"></div>
<div id="death-screen">RESPAWNING...</div>

<script>
window.addEventListener('error',function(e){
  var p=document.getElementById('menu-panel'); if(!p) return;
  p.style.display='block'; p.style.color='#ff8080'; p.style.maxWidth='90vw'; p.style.wordBreak='break-word';
  p.textContent='ERROR: '+e.message+' (line '+e.lineno+')';
});
</script>
<script src="three.min.js"></script>
<script>
(function(){
'use strict';
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

/* =========================================================================
   AUDIO — lightweight generated sfx (no external files)
========================================================================= */
const Audio_ = (function(){
  let ctx = null;
  function ac(){ if(!ctx){ try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return ctx; }

  // Real audio files: dropped into a "sounds/" folder next to index.html.
  // Missing files fail silently (caught) so the game still runs without them.
  const musicTracks = ['sounds/back1.mp3', 'sounds/back2.mp3'];
  let musicEls = [], curTrack = -1, musicVol = 0.35;
  function initMusic(){
    if(musicEls.length) return;
    musicEls = musicTracks.map(src=>{
      const a = new Audio(src); a.preload='auto'; a.volume=musicVol;
      a.addEventListener('error', ()=>{}, true);
      return a;
    });
  }
  function playNextTrack(){
    if(!musicEls.length) return;
    curTrack = (curTrack+1) % musicEls.length;
    const el = musicEls[curTrack];
    el.currentTime = 0;
    el.play().catch(()=>{});
    el.onended = playNextTrack;
  }
  function stopMusic(){ musicEls.forEach(a=>{ try{ a.pause(); }catch(e){} }); }

  const mutateSfx = new Audio('sounds/mutate.mp3');
  mutateSfx.preload = 'auto'; mutateSfx.volume = 0.7;
  mutateSfx.addEventListener('error', ()=>{}, true);
  function playMutate(){ try{ mutateSfx.currentTime = 0; mutateSfx.play().catch(()=>{}); }catch(e){} }
  function beep(freq, dur, type, vol, glideTo){
    const a = ac(); if(!a) return;
    const o = a.createOscillator(); const g = a.createGain();
    o.type = type||'sine'; o.frequency.setValueAtTime(freq, a.currentTime);
    if(glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, a.currentTime+dur);
    g.gain.setValueAtTime(vol||0.15, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime+dur);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur);
  }
  function noise(dur, vol){
    const a = ac(); if(!a) return;
    const buf = a.createBuffer(1, a.sampleRate*dur, a.sampleRate);
    const d = buf.getChannelData(0);
    for(let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * (1 - i/d.length);
    const src = a.createBufferSource(); src.buffer = buf;
    const g = a.createGain(); g.gain.value = vol||0.2;
    src.connect(g); g.connect(a.destination); src.start();
  }
  return {
    footstep(){ noise(0.06, 0.05); },
    jump(){ beep(300,0.15,'square',0.12,520); },
    land(){ noise(0.08,0.12); },
    breakBlock(){ noise(0.12,0.18); },
    place(){ beep(200,0.08,'square',0.1,260); },
    attack(){ beep(150,0.1,'sawtooth',0.15,90); },
    hit(){ noise(0.08,0.2); },
    transform(){ beep(220,0.35,'sine',0.18,880); setTimeout(()=>beep(880,0.2,'sine',0.15,440),120); playMutate(); },
    special(){ beep(400,0.3,'sawtooth',0.18,700); },
    death(){ beep(400,0.6,'sawtooth',0.2,60); },
    resume(){
      const a=ac(); if(a && a.state==='suspended') a.resume();
      initMusic();
      if(curTrack===-1) playNextTrack();
    },
    setMusicVolume(v){ musicVol=v; musicEls.forEach(a=>a.volume=v); },
    stopMusic, playNextTrack
  };
})();

/* =========================================================================
   GRAPHICS QUALITY
========================================================================= */
const QUALITY = { level:'MEDIUM',
  presets:{
    LOW:{shadow:false,shadowSize:512,fogFar:44,pixelRatio:1,renderDist:22},
    MEDIUM:{shadow:true,shadowSize:1024,fogFar:70,pixelRatio:Math.min(devicePixelRatio,1.5),renderDist:32},
    HIGH:{shadow:true,shadowSize:2048,fogFar:100,pixelRatio:Math.min(devicePixelRatio,2),renderDist:42}
  }
};

/* =========================================================================
   RENDERER / SCENE / CAMERA
========================================================================= */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 400);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const ambient = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xfff3d0, 1.0);
sun.castShadow = true;
scene.add(sun);
scene.add(sun.target);

function applyQuality(){
  const p = QUALITY.presets[QUALITY.level];
  renderer.setPixelRatio(p.pixelRatio);
  renderer.shadowMap.enabled = p.shadow;
  sun.castShadow = p.shadow;
  sun.shadow.mapSize.set(p.shadowSize, p.shadowSize);
  sun.shadow.camera.left=-45; sun.shadow.camera.right=45;
  sun.shadow.camera.top=45; sun.shadow.camera.bottom=-45;
  sun.shadow.camera.far=120;
  scene.fog = new THREE.Fog(0x8fc7f2, 14, p.fogFar);
}
applyQuality();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

/* =========================================================================
   WORLD / VOXEL TERRAIN
========================================================================= */
const WORLD = 128;                 // columns per side
const HALF = WORLD/2;
const WATER_LEVEL = 0;
const BLOCK_TYPES = ['grass','dirt','stone','sand','wood','leaves','asphalt','concrete'];
const BLOCK_COLOR = { grass:0x5fae3c, dirt:0x6b4a2d, stone:0x8a8a8a, sand:0xdfd0a0, wood:0x6b4a2d, leaves:0x2e8b3d, asphalt:0x3a3a40, concrete:0xb4b4ac };
const PLACE_HEADROOM = 400;       // extra instances reserved for player-placed blocks per type

function noise2(x,z){
  return Math.sin(x*0.15)*1.6 + Math.cos(z*0.18)*1.6 + Math.sin((x+z)*0.07)*2.2 + Math.cos((x-z)*0.09)*1.2;
}
function surfaceHeight(x,z){ return 1; }
function zoneType(x,z){ const a=((x%16)+16)%16, b=((z%16)+16)%16; if(a<4||b<4) return 'asphalt'; if(a===4||a===15||b===4||b===15) return 'concrete'; return 'grass'; }

// block registry: key "x,y,z" -> {type, mesh, instanceId, active}
const blocks = new Map();
const keyOf = (x,y,z)=> x+','+y+','+z;

const meshes = {};
const usedCount = {};
BLOCK_TYPES.forEach(t=>{
  const mat = new THREE.MeshLambertMaterial({ color: BLOCK_COLOR[t], transparent:false });
  const cap = WORLD*WORLD*2 + 3000;
  const m = new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1), mat, cap);
  m.castShadow = true; m.receiveShadow = true; m.count = 0; m.frustumCulled = false;
  scene.add(m); meshes[t]=m; usedCount[t]=0;
});
const freeSlots = { grass:[], dirt:[], stone:[], sand:[], wood:[], leaves:[], asphalt:[], concrete:[] };

const dummy = new THREE.Object3D();
function setInstance(type, x, y, z){
  const mesh = meshes[type];
  let idx;
  if(freeSlots[type].length){ idx = freeSlots[type].pop(); }
  else { idx = usedCount[type]++; mesh.count = Math.max(mesh.count, usedCount[type]); }
  dummy.position.set(x,y,z); dummy.scale.set(1,1,1); dummy.updateMatrix();
  mesh.setMatrixAt(idx, dummy.matrix);
  mesh.instanceMatrix.needsUpdate = true;
  blocks.set(keyOf(x,y,z), {type, idx, active:true});
  return idx;
}
function removeBlockAt(x,y,z){
  const k = keyOf(x,y,z); const b = blocks.get(k);
  if(!b || !b.active) return null;
  const mesh = meshes[b.type];
  dummy.position.set(0,-9999,0); dummy.scale.set(0,0,0); dummy.updateMatrix();

function addBlockAt(type, x, y, z){
  const k = keyOf(x,y,z);
  if(blocks.has(k) && blocks.get(k).active) return false;
  setInstance(type, x, y, z);
  columnHeight[colKey(x,z)] = Math.max(columnHeight[colKey(x,z)]||-99, y);

}

function recomputeColumnTop(x,z){
  let top = -99;
  for(let y=-14;y<=20;y++){ if(isSolid(x,y,z)) top = Math.max(top,y); }

}

    // small carved pits ("caves") — rare shallow depressions
    const pit = false;
    const colTop = pit ? h-2 : h;
    for(let y = h-2; y <= colTop; y++){
      let type;
      if(y === colTop) type = topType;
      else if(y >= colTop-1) type = (topType==='sand') ? 'sand' : 'dirt';

}

// Returns the Y of the walkable surface (top face of the highest solid block).
function groundTopAt(x,z){
  const gx = Math.round(x), gz = Math.round(z);
  const cgx = Math.max(-HALF, Math.min(HALF-1, gx));

const DAY_LENGTH = 240; // seconds per full cycle
let dayT = 0.25; // start mid-morning
const skyDay = new THREE.Color(0x8fc7f2), skyNight = new THREE.Color(0x0a1020);
const fogDay = new THREE.Color(0x8fc7f2), fogNight = new THREE.Color(0x0a1020);
function updateDayNight(dt){
  dayT = (dayT + dt/DAY_LENGTH) % 1;
  const angle = dayT * Math.PI * 2;
  sun.position.set(player.pos.x + Math.cos(angle)*60, Math.max(8,Math.sin(angle)*70), player.pos.z + Math.sin(angle)*30);
  sun.target.position.copy(player.pos);      // keep the shadow frustum centered on the player as they roam
  const light = Math.max(0.08, Math.sin(angle));
  const mix = THREE.MathUtils.clamp(light,0,1);
  scene.background = skyNight.clone().lerp(skyDay, mix);
  scene.fog.color.copy(fogNight.clone().lerp(fogDay, mix));
  ambient.intensity = 0.25 + 0.4*mix;
  sun.intensity = 0.3 + 0.9*mix;
}

/* =========================================================================
   CHARACTER MODEL BUILDER
========================================================================= */
function buildCharacter(kind){
  const g = new THREE.Group();
  const parts = {};
  function box(w,h,d,color){ const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshLambertMaterial({color})); m.castShadow=true; return m; }

  let scaleY = 1, palette;
  switch(kind){
    case 'four_arms': palette = {skin:0xd8432e, torso:0x2244aa, accent:0x111111}; scaleY=1.25; break;
    case 'heatblast': palette = {skin:0xff9a2e, torso:0xff5a1e, accent:0xffe27a}; break;
    case 'xlr8':      palette = {skin:0x1c3fbf, torso:0x0c2270, accent:0x8fd6ff}; scaleY=0.95; break;
    case 'diamondhead': palette = {skin:0x35c9c0, torso:0x1e8f88, accent:0xdfffff}; break;
    case 'echo_echo': palette = {skin:0xf1f4f7, torso:0xdde3e9, accent:0x1a1a1a}; scaleY=0.85; break;
    case 'kolossus': palette = {skin:0x8a7a6a, torso:0x5c4f43, accent:0xff9a3c}; scaleY=2.4; break;
    case 'sporeback': palette = {skin:0x5a8f3a, torso:0x3d6626, accent:0xc9e86a}; scaleY=1.5; break;
    default: palette = {skin:0xe0a878, torso:0x2c7a3d, accent:0x111111}; kind='ben';
  }
  // Per-kind body proportions: bulk vs slender build.
  const torsoWidth = kind==='four_arms' ? 1.5 : kind==='kolossus' ? 1.9 : kind==='sporeback' ? 1.7 : 0.9;
  const torsoDepth = kind==='four_arms' ? 0.75 : kind==='kolossus' ? 1.0 : kind==='sporeback' ? 0.9 : 0.5;
  const legWidth   = kind==='four_arms' ? 0.2  : kind==='kolossus' ? 0.55 : kind==='sporeback' ? 0.5 : 0.3;

  // Vertical layout, built bottom-up from the group root (which sits at ground/feet level):
  const legH = 0.9, torsoH = 1.1, headH = 0.7;
  const hipY = legH * scaleY;                 // top of legs / bottom of torso
  const torsoCenterY = hipY + (torsoH/2) * scaleY;
  const shoulderY = hipY + torsoH * 0.82 * scaleY;
  const headCenterY = hipY + (torsoH + headH/2) * scaleY;

  const head = box(0.7,0.7,0.7, kind==='diamondhead'?palette.accent:palette.skin);
  head.position.y = headCenterY;
  if(kind==='echo_echo'){ const vz=box(0.5,0.14,0.06,0x111111); vz.position.set(0,headCenterY+0.05,-0.36); g.add(vz); }
  if(kind==='diamondhead'){ head.geometry = new THREE.OctahedronGeometry(0.55); }
  if(kind==='kolossus'){ head.geometry = new THREE.BoxGeometry(0.85,0.75,0.85); [-0.3,0.3].forEach(x=>{ const horn=new THREE.Mesh(new THREE.ConeGeometry(0.14,0.4,5),new THREE.MeshLambertMaterial({color:palette.accent})); horn.position.set(x,headCenterY+0.5,0.1); horn.castShadow=true; g.add(horn); }); }
  if(kind==='sporeback'){ head.geometry = new THREE.BoxGeometry(0.75,0.55,0.9); [-0.34,0.34].forEach(x=>{ const spike=new THREE.Mesh(new THREE.ConeGeometry(0.1,0.3,4),new THREE.MeshLambertMaterial({color:palette.accent})); spike.position.set(x,headCenterY+0.35,-0.1); spike.castShadow=true; g.add(spike); }); }
  g.add(head); parts.head = head;
  if(kind==='kolossus'||kind==='sporeback'){
    const plateCount = 3, plateColor = palette.accent;
    for(let i=0;i<plateCount;i++){
      const py = torsoCenterY + (i-1)*0.32*scaleY;
      const plate = new THREE.Mesh(new THREE.ConeGeometry(0.16,0.3,4), new THREE.MeshLambertMaterial({color:plateColor}));
      plate.rotation.x = Math.PI/2; plate.position.set(0, py, -torsoDepth/2-0.05); plate.castShadow=true; g.add(plate);
    }
  }

  const torso = box(torsoWidth,torsoH,torsoDepth, palette.torso);
  torso.position.y = torsoCenterY;
  g.add(torso); parts.torso = torso;
  if(kind==='echo_echo'){ [-0.27,0.27].forEach(x=>{ const c=new THREE.Mesh(new THREE.CylinderGeometry(0.17,0.17,0.08,10),new THREE.MeshLambertMaterial({color:0x111111})); c.rotation.x=Math.PI/2; c.position.set(x,torsoCenterY+0.12,-torsoDepth/2-0.03); g.add(c); }); }

  const armGeo = kind==='four_arms' ? [0.3,0.95,0.3] : [0.24,0.85,0.24];
  const armSpacing = kind==='four_arms' ? torsoWidth/2 + 0.18 : 0.62;
  function makeArm(x, extra){
    const arm = box(armGeo[0],armGeo[1],armGeo[2], extra? palette.accent : palette.skin);
    arm.geometry.translate(0,-armGeo[1]/2,0);   // pivot at shoulder (top of arm)
    arm.position.set(x, shoulderY, 0);
    g.add(arm); return arm;
  }
  parts.leftArm = makeArm(-armSpacing);
  parts.rightArm = makeArm(armSpacing);
  if(kind==='four_arms'){
    // second, slightly lower pair of arms for the classic four-armed silhouette
    parts.leftArm2 = makeArm(-armSpacing*0.68, true);
    parts.rightArm2 = makeArm(armSpacing*0.68, true);
    parts.leftArm2.position.y -= 0.25;
    parts.rightArm2.position.y -= 0.25;
  }

  function makeLeg(x){
    const leg = box(legWidth,legH,legWidth, palette.accent);
    leg.geometry.translate(0,-legH/2,0);        // pivot at hip (top of leg); bottom reaches y=0 (feet)
    leg.position.set(x, hipY, 0);
    g.add(leg); return leg;
  }
  const legSpacing = kind==='four_arms' ? 0.18 : 0.26;
  parts.leftLeg = makeLeg(-legSpacing);
  parts.rightLeg = makeLeg(legSpacing);

  const o = new THREE.Group(); g.position.y = -0.9; o.add(g); o.rotation.order = 'YXZ';
  o.userData.parts = parts; o.userData.kind = kind;
  return o;
}

// tiny portrait renderer (renders each alien to a mini canvas for the HUD)
function renderPortrait(kind){
  const size = 92;
  const pr = new THREE.WebGLRenderer({antialias:true, alpha:true});
  pr.setSize(size,size);
  const psc = new THREE.Scene();
  psc.add(new THREE.AmbientLight(0xffffff,0.9));
  const pl = new THREE.DirectionalLight(0xffffff,0.8); pl.position.set(2,3,4); psc.add(pl);
  const model = buildCharacter(kind);
  model.rotation.y = Math.PI*0.25;
  model.position.y = -0.1;
  psc.add(model);
  const pcam = new THREE.PerspectiveCamera(35,1,0.1,10);
  pcam.position.set(0,0.6,3.3); pcam.lookAt(0,0.5,0);
  pr.render(psc, pcam);
  return pr.domElement;
}

const PS = 0.55; // player model scale
const camState = { dist:4.2, height:1.1 };
function updateCamera(){
  // A proper look direction that incorporates pitch (up/down) as well as yaw,
  // so tilting down actually tilts the view down instead of just changing
  // camera height while still staring at a fixed point.
  const lookDir = new THREE.Vector3(
    Math.cos(player.pitch) * -Math.sin(player.yaw),
    Math.sin(player.pitch),
    Math.cos(player.pitch) * -Math.cos(player.yaw)
  );
  const pivot = player.pos.clone().add(new THREE.Vector3(0, camState.height, 0));
  const desired = pivot.clone().addScaledVector(lookDir, -camState.dist);
  camera.position.lerp(desired, 0.18);
  const lookAt = pivot.clone().addScaledVector(lookDir, 8);
  camera.lookAt(lookAt);
}

const projectiles = [];
function spawnProjectile(pl, color, damage, speed, pierce, style){
  const geo=style==='crystal'?new THREE.OctahedronGeometry(0.3):new THREE.SphereGeometry(style==='fire'?0.5:0.22,8,8);
  const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color}));
  if(style==='crystal') mesh.scale.set(.7,1.7,.7);
  if(style==='fire') mesh.add(new THREE.Mesh(new THREE.SphereGeometry(.28,8,8),new THREE.MeshBasicMaterial({color:0xffe27a})));
  const cp=Math.cos(pl.pitch||0);
  const dir = new THREE.Vector3(-Math.sin(pl.yaw)*cp, Math.sin(pl.pitch||0), -Math.cos(pl.yaw)*cp);
  mesh.position.copy(pl.pos).add(new THREE.Vector3(0,1.2,0)).add(dir.clone().multiplyScalar(1.2));
  scene.add(mesh);
  projectiles.push({mesh, dir, speed, damage, pierce, style, life:2.2, hitSet:new Set()});
  Audio_.special();
}
function updateProjectiles(dt){
  for(let i=projectiles.length-1;i>=0;i--){
    const p = projectiles[i];
    p.mesh.position.addScaledVector(p.dir, p.speed*dt);
    p.life -= dt;
    let dead = p.life<=0;
    const pp=p.mesh.position;
    if(pp.y<groundTopAt(pp.x,pp.z)||blockedAt(pp.x,pp.z,pp.y-0.5)) dead=true;
    if(p.style==='fire'){ for(let k=0;k<2;k++) debris(pp.clone().add(new THREE.Vector3((Math.random()-.5)*.3,(Math.random()-.5)*.3,(Math.random()-.5)*.3)),Math.random()<.5?0xff5a1e:0xffd84a,.4+Math.random()*.3,new THREE.Vector3(0,1.2,0),.45,false); p.mesh.scale.setScalar(1+Math.sin(p.life*30)*.12); }
    else if(p.style==='crystal') p.mesh.rotation.y+=dt*10;
    for(const en of enemies){
      if(!en.alive || p.hitSet.has(en)) continue;
      if(p.mesh.position.distanceTo(en.mesh.position) < 1.0){
        damageEnemy(en, p.damage, p.dir);
        p.hitSet.add(en);
        if(!p.pierce) dead = true;
      }
    }
    if(dead){ if(p.style==='fire') for(let k=0;k<8;k++) debris(p.mesh.position.clone(),Math.random()<.5?0xff5a1e:0xffd84a,.5,new THREE.Vector3((Math.random()-.5)*6,Math.random()*5,(Math.random()-.5)*6),.6,false); scene.remove(p.mesh); projectiles.splice(i,1); }
  }
}

function damageEnemy(en, dmg, dirAway){
  if(!en.alive) return;
  if(en.npc){ npcHurt(en,dmg,dirAway); return; }
  en.hp -= dmg;
  en.mesh.material.emissive = new THREE.Color(0x550000);
  setTimeout(()=>{ if(en.mesh.material) en.mesh.material.emissive = new THREE.Color(0x000000); }, 120);
  if(dirAway){ en.mesh.position.addScaledVector(dirAway, 0.8); }
  Audio_.hit();
  if(en.hp <= 0){
    en.alive = false;
    scene.remove(en.mesh);
    setTimeout(()=>{
      const x = Math.round((Math.random()-0.5)*(WORLD-8));
      const z = Math.round((Math.random()-0.5)*(WORLD-8));
      Object.assign(en, makeEnemy(en.type,x,z));
    }, 8000);
  }
}

function updateEnemies(dt){
  enemies.forEach(en=>{
    if(!en.alive||en.npc) return;
    if(en.ice) return;
    const p = en.mesh.position;
    const tu=nearestTarget(p), tpos=tu.pos, distToPlayer=p.distanceTo(tpos);
    en.atkCd = Math.max(0, en.atkCd - dt);

    if(distToPlayer < 8){ en.state = 'chase'; }
    else if(distToPlayer > 12){ en.state = 'wander'; }

    if(en.state === 'chase'){
      const dir = tpos.clone().sub(p); dir.y = 0; dir.normalize();
      if(distToPlayer > 1.4){
        p.addScaledVector(dir, en.speed*dt);
      } else if(en.atkCd<=0 && player.alive && (tu.unit || player.invuln<=0)){
        if(tu.unit){ tu.unit.health -= en.damage; } else { player.health -= en.damage; player.invuln = 0.6; flashDamage(); }
        en.atkCd = 1.2;
      }
      p.y = groundTopAt(p.x,p.z) + (en.type==='brute'?0.8:0.55);
      en.mesh.lookAt(tpos.x, p.y, tpos.z);
    } else {
      en.wanderT -= dt;
      if(en.wanderT<=0){
        en.target.set(en.home.x + (Math.random()-0.5)*6, 0, en.home.z + (Math.random()-0.5)*6);
        en.wanderT = 2 + Math.random()*3;
      }
      const dir = en.target.clone().sub(p); dir.y=0;
      if(dir.length()>0.3){ dir.normalize(); p.addScaledVector(dir, en.speed*0.4*dt); }
      p.y = groundTopAt(p.x,p.z) + (en.type==='brute'?0.8:0.55);
    }
  });
}

    player.shieldT-=dt; player.invuln=Math.max(player.invuln,.1);
    if(shield){ shield.position.set(player.pos.x,player.pos.y-1,player.pos.z); shield.rotation.y+=dt*3; if(player.shieldT<=0){ scene.remove(shield); shield=null; } }

    const c=crystals[i]; c.age+=dt; c.life-=dt;
    c.m.scale.y=Math.max(.01,Math.min(1,c.age*4)*Math.min(1,Math.max(0,c.life)*2)*3.6); c.m.position.y=c.gy+c.m.scale.y/2;

function addIce(pos,sx,sy,sz,ref,rot){

function updateIces(dt){

function streamTick(kind,dt){

    const f=debris(from.clone(),cols[rnd(3)],fire?.35+Math.random()*.25:.22+Math.random()*.2,v,fire?.5:.55,false);
    if(fire) f.grow=1.8;

function updateStreams(dt){

  const cv=document.createElement('canvas'); cv.width=128; cv.height=64; const g=cv.getContext('2d');
  g.fillStyle=on?'#39ff8a':'rgba(10,20,15,.85)'; g.strokeStyle=on?'#eafff2':'#39ff8a'; g.lineWidth=5;
  g.beginPath(); if(g.roundRect) g.roundRect(6,6,116,52,16); else g.rect(6,6,116,52); g.fill(); g.stroke();
  g.fillStyle=on?'#04140a':'#eafff2'; g.font='bold '+(txt.length>2?30:40)+'px sans-serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(txt,64,35);

function raycastBlocks(){
  const o=camera.position, d=new THREE.Vector3(); camera.getWorldDirection(d);
  let prev=null;
  for(let s=0.5;s<10;s+=0.08){
    const x=Math.round(o.x+d.x*s), y=Math.round(o.y+d.y*s), z=Math.round(o.z+d.z*s);

}

function tryBreakBlock(){

function tryPlaceBlock(){

function doJump(){
  if(!player.alive) return;
  if(player.swimming){ player.vel.y=7; return; }
  if(player.form.flies){
    if(!player.flying){
      player.flying = true;
      player.vel.y = player.form.jump;
      statusText('TAKING OFF — look up/down + move to steer, JUMP again to land');
    } else {
      player.flying = false; // gravity resumes and brings you back down
    }
  } else if(player.onGround){
    player.vel.y = player.form.jump; player.onGround=false; Audio_.jump();
  }
}
const GRAVITY = -18;
const WORLD_LIMIT = HALF - 1;
function flySpeedOf(p){ return (p.form.flySpeed||8) * 0.6; }

function updatePlayer(dt){

    const nz = player.pos.z + moveZ*flySpeed*dt;

      const fy=player.pos.y-1;

  if(!player.flying) props.forEach(p=>{

    const dx=player.pos.x-p.mesh.position.x, dz=player.pos.z-p.mesh.position.z, d=Math.hypot(dx,dz), r=p.s*.6+.4;
    if(d<r&&d>.001&&player.pos.y-1<p.mesh.position.y+p.s*.5-.1){ player.pos.x+=dx/d*(r-d); player.pos.z+=dz/d*(r-d); }

  player.model.rotation.y = THREE.MathUtils.lerp(player.model.rotation.y, facing, 0.25);
  const formScale = PS * (player.form.modelScale||1) * (player.grown?1.6:1);
  player.model.position.set(player.pos.x, player.pos.y-1+0.9*formScale, player.pos.z); player.model.scale.setScalar(formScale);

  if(!player.onGround){ if(parts.leftLeg) parts.leftLeg.rotation.x = -0.3; if(parts.rightLeg) parts.rightLeg.rotation.x = 0.3; }
  if(player.attacking > 0){
    const k=Math.sin(Math.min(1,player.attacking/0.25)*Math.PI), side=player.punchSide?['rightArm','rightArm2']:['leftArm','leftArm2'];
    side.forEach(n=>{ if(parts[n]) parts[n].rotation.x=1.7*k; });
    const o=player.attacking>0?(player.punchSide?-1:1)*0.35*k:0; player.model.userData.twist=o;
  }
  poseExtras(parts, moving, dt);

  // footstep sound throttling
  player._stepT = (player._stepT||0) + dt;
  if(moving && player.onGround && player._stepT > 0.32){ Audio_.footstep(); player._stepT=0; }

  // fell into water / void safety
  if(player.pos.y < -40){ player.health = 0; }

  // death
  if(player.health <= 0 && player.alive && !(squad.length>1 && activeDied())){
    player.alive = false;
    Audio_.death();
    document.getElementById('death-screen').style.display='flex';
    setTimeout(()=>{
      player.pos.set(0.5, groundTopAt(0.5,0.5)+1, 0.5);
      player.vel.set(0,0,0);
      revertToBen();
      player.alive = true;
      document.getElementById('death-screen').style.display='none';
    }, 1400);
  }
}

/* =========================================================================
   UI SYNC
========================================================================= */
function syncHud(){
  const hp = Math.max(0, player.health/player.form.maxHealth*100);
  const en = Math.max(0, player.energy/player.form.maxEnergy*100);
  document.getElementById('health-fill').style.width = hp+'%';
  document.getElementById('energy-fill').style.width = en+'%';
  (player.form.actions||[]).forEach((a,i)=>{ const el=actEls[i]; if(!el) return;
    const l=typeof a.label==='function'?a.label():a.label; if(el.dataset.l!==l){ el.dataset.l=l; el.innerHTML='<i>'+(ICON[l]||'✦')+'</i><b>'+l+'</b>'; }
    el.style.display=(a.show&&!a.show())?'none':'flex';
    el.classList.toggle('cooldown',(actCd[i]||0)>0||player.energy<a.cost); });
  const specBtn = document.getElementById('btn-special');
  if(player.form.special && !player.form.actions){
    specBtn.style.display='flex';
    specBtn.classList.toggle('cooldown', player.specialTimer>0 || player.energy < player.form.special.cost);
  } else {
    specBtn.style.display='none';
  }
}

/* =========================================================================
   MAIN LOOP
========================================================================= */
const clock = new THREE.Clock();
function loop(){
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), 0.05);
  if(player.slowT>0) player.slowT-=dt;
  timeScale += ((player.slowT>0?0.3:1)-timeScale)*Math.min(1,dt*6);
  document.getElementById('slow-overlay').style.opacity = timeScale<0.9?1:0;
  const wdt = dt*timeScale;
  updateDayNight(wdt);
  updatePlayer(dt);
  updateEnemies(wdt); updateProjectiles(wdt); updateProps(wdt); updateFx(wdt); updateTornado(wdt); updateCrystals(dt); updateSquad(wdt); updateStreams(dt); updateIces(wdt); updateNpcs(wdt);
  updateCamera();
  const under = camera.position.y < WATER_LEVEL+0.4;
  if(under){ scene.fog.color.set(0x1d5c8c); scene.background = scene.fog.color.clone(); }
  scene.fog.near = under?1:14; scene.fog.far = under?26:QUALITY.presets[QUALITY.level].fogFar;
  if(camShake>0){ camShake=Math.max(0,camShake-dt*2); camera.position.x += (Math.random()-0.5)*camShake; camera.position.y += (Math.random()-0.5)*camShake; }
  syncHud();
  renderer.render(scene, camera);
}

/* =========================================================================
   START MENU WIRING
========================================================================= */
const menuPanel = document.getElementById('menu-panel');
function showPanel(html){ menuPanel.innerHTML = html; menuPanel.classList.add('show'); }
document.getElementById('btn-controls').addEventListener('click', ()=> showPanel(
  isTouch
  ? 'LEFT: joystick to move.<br>RIGHT SIDE: swipe to look around.<br>Swipe the alien portrait (top-left) to switch aliens, tap it to revert to Ben.<br>Big button = Attack (hold = place block). Arrow button = Jump. Bolt button = Special.'
  : 'WASD to move, mouse to look (click to lock).<br>Left click = Attack, Right click = Place block.<br>F = Attack, G = Place, Space = Jump, E/R/T/Y = alien actions, Q = Revert to Ben. Fly/swim: look up or down while moving.'
));
document.getElementById('btn-about').addEventListener('click', ()=> showPanel(
  'OMNITRIX: VOXEL PROTOCOL — an original fan-made prototype blending a Minecraft-style voxel world with Ben 10 Alien Force-inspired transformation and combat mechanics. All characters, names and visuals here are original interpretations.'
));
document.getElementById('btn-settings').addEventListener('click', ()=>{
  showPanel('<div>GRAPHICS QUALITY</div><div id="quality-row"></div>');
  const row = document.getElementById('quality-row');
  ['LOW','MEDIUM','HIGH'].forEach(q=>{
    const b = document.createElement('div');
    b.className = 'qbtn' + (QUALITY.level===q?' active':'');
    b.textContent = q;
    b.addEventListener('click', ()=>{ QUALITY.level=q; applyQuality(); [...row.children].forEach(c=>c.classList.remove('active')); b.classList.add('active'); });
    row.appendChild(b);
  });
});

function beginGame(){
  document.getElementById('start-screen').style.display = 'none';
  document.getElementById('hud').style.display = 'block';
  Audio_.resume();
  setForm(BEN, 'ben');
  if(!isTouch){ renderer.domElement.requestPointerLock && renderer.domElement.requestPointerLock(); }
  if(screen.orientation && screen.orientation.lock){ try{ screen.orientation.lock('landscape').catch(()=>{}); }catch(e){} }
  loop();
}
let starting=false;
function startOnce(e){ if(starting) return; starting=true; if(e) e.preventDefault(); beginGame(); }
document.getElementById('btn-start').addEventListener('click', startOnce);
document.getElementById('btn-start').addEventListener('touchend', startOnce, {passive:false});

// initial portrait render for Ben so card isn't empty before start
document.getElementById('alien-portrait').appendChild(getPortraitCanvas('ben'));
})();
</script>
