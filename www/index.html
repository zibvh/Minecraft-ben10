<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>OMNITRIX // Voxel Protocol</title>
<style>
  :root{
    --green:#39ff8a; --green-dim:#1c7a45; --panel:#0b1210ee; --panel2:#0e1a16dd;
    --danger:#ff4444; --energy:#28b7ff; --edge:#122b1e;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;}
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;
    font-family:'Segoe UI',Roboto,Consolas,monospace;}
  canvas{display:block;touch-action:none;}

  /* ---------- START MENU ---------- */
  #start-screen{
    position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:radial-gradient(ellipse at 50% 30%, #10251a 0%, #050807 70%);color:#eafff2;
    padding:env(safe-area-inset-top,16px) 20px env(safe-area-inset-bottom,16px);
  }
  #start-screen h1{
    font-size:30px;letter-spacing:4px;margin:0 0 4px;color:var(--green);
    text-shadow:0 0 16px rgba(57,255,138,0.6);
  }
  #start-screen .sub{opacity:0.6;font-size:12px;letter-spacing:2px;margin-bottom:26px;}
  .menu-btn{
    width:230px;padding:13px 0;margin:6px 0;background:linear-gradient(180deg,#12261c,#0a140f);
    border:1px solid var(--green-dim);color:var(--green);font-size:15px;letter-spacing:2px;
    clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);
  }
  .menu-btn:active{background:#183a26;}
  #menu-panel{display:none;max-width:340px;font-size:13px;line-height:1.6;opacity:0.85;text-align:center;margin-top:14px;}
  #menu-panel.show{display:block;}
  #quality-row{display:flex;gap:8px;justify-content:center;margin-top:8px;}
  .qbtn{padding:6px 14px;border:1px solid var(--green-dim);color:#9fe;background:#0a140f;font-size:12px;letter-spacing:1px;}
  .qbtn.active{background:var(--green-dim);color:#fff;}

  /* ---------- HUD ---------- */
  #hud{position:fixed;z-index:20;pointer-events:none;inset:0;display:none;}
  #alien-card{
    position:absolute;top:max(14px,env(safe-area-inset-top,14px));left:14px;
    width:190px;background:var(--panel);border:1px solid var(--green-dim);
    clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%);
    padding:8px 10px 10px;pointer-events:auto;touch-action:none;
  }
  #alien-portrait-wrap{display:flex;align-items:center;gap:8px;}
  #alien-portrait{
    width:46px;height:46px;border:1px solid var(--green);background:#081b12;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative;overflow:hidden;
  }
  #alien-portrait canvas{width:100%;height:100%;}
  #alien-name{font-size:13px;letter-spacing:1px;color:var(--green);font-weight:700;line-height:1.2;}
  #alien-hint{font-size:9px;opacity:0.45;letter-spacing:0.5px;margin-top:1px;}
  .bar-row{display:flex;align-items:center;gap:5px;margin-top:6px;}
  .bar-label{font-size:9px;width:22px;opacity:0.7;letter-spacing:.5px;}
  .bar-num{font-size:9px;width:26px;text-align:right;opacity:.85;font-variant-numeric:tabular-nums;}
  #ben-fill{background:linear-gradient(90deg,#8a7bff,#b7b0ff);}
  #health-fill.low{animation:omniwarn .5s infinite alternate;}
  #lowhp-overlay{position:fixed;inset:0;pointer-events:none;z-index:54;opacity:0;transition:opacity .4s;box-shadow:inset 0 0 130px 26px rgba(200,0,0,.55);}
  #lowhp-overlay.on{opacity:1;animation:lowpulse 1.1s ease-in-out infinite;}
  @keyframes lowpulse{0%,100%{opacity:.35}50%{opacity:1}}
  .bar-track{flex:1;height:7px;background:#050a07;border:1px solid #1c2b22;position:relative;}
  .bar-fill{height:100%;width:100%;transition:width 0.15s linear;}
  #health-fill{background:linear-gradient(90deg,#ff5555,#ff9955);}
  #energy-fill{background:linear-gradient(90deg,#1c8fff,#39ffe0);}
  #omni-fill{background:linear-gradient(90deg,#1f9d55,#7dffb0);}
  #alien-card.warn{border-color:#ff4a4a;box-shadow:0 0 14px rgba(255,60,60,.55);}
  #alien-card.warn #omni-fill{background:#ff4a4a;animation:omniwarn .45s infinite alternate;}
  #alien-card.locked #omni-fill{background:#7a5a2a;}
  @keyframes omniwarn{from{opacity:1}to{opacity:.35}}
  #omni-dial{position:absolute;top:max(14px,env(safe-area-inset-top,14px));left:220px;display:none;gap:6px;pointer-events:auto;touch-action:none;z-index:26;}
  #omni-dial.show{display:flex;animation:dialin .14s ease-out;}
  @keyframes dialin{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
  .od{width:46px;height:58px;background:var(--panel);border:1px solid var(--green-dim);display:flex;flex-direction:column;align-items:center;padding-top:2px;
    clip-path:polygon(0 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%);transition:transform .08s,border-color .1s,opacity .12s;cursor:pointer;}
  .od img{width:40px;height:40px;display:block;background:#081b12;}
  .od b{font-size:7px;letter-spacing:.4px;color:var(--green);margin-top:2px;white-space:nowrap;}
  .od.cur{border-color:#fff;background:#173a25;}
  .od.off{opacity:.32;}
  .od:active{transform:scale(.9);border-color:var(--green);}

  #alien-banner{
    position:absolute;top:80px;left:50%;transform:translateX(-50%);
    color:var(--green);font-size:20px;letter-spacing:4px;text-shadow:0 0 12px rgba(57,255,138,0.8);
    opacity:0;transition:opacity 0.25s;
  }
  #alien-banner.show{opacity:1;}

  #flash-overlay{position:fixed;inset:0;background:var(--green);opacity:0;pointer-events:none;z-index:60;}
  #damage-overlay{position:fixed;inset:0;pointer-events:none;z-index:55;
    box-shadow:inset 0 0 120px 20px rgba(255,0,0,0);transition:box-shadow 0.2s;}

  #crosshair{position:fixed;top:50%;left:50%;width:14px;height:14px;transform:translate(-50%,-50%);
    z-index:15;pointer-events:none;}
  #crosshair::before,#crosshair::after{content:'';position:absolute;background:rgba(255,255,255,0.7);}
  #crosshair::before{top:50%;left:0;width:100%;height:1.5px;transform:translateY(-.75px);}
  #crosshair::after{left:50%;top:0;height:100%;width:1.5px;transform:translateX(-.75px);}

  #hotbar{position:absolute;bottom:max(10px,env(safe-area-inset-bottom,10px));left:50%;transform:translateX(-50%);
    display:flex;gap:5px;pointer-events:auto;touch-action:none;}
  .hotslot{width:38px;height:38px;background:var(--panel);border:1px solid #26402f;position:relative;}
  .hotslot.sel{border-color:var(--green);box-shadow:0 0 8px rgba(57,255,138,0.6);}
  .hotslot canvas{width:100%;height:100%;}

  #joystick-zone{position:absolute;left:max(20px,env(safe-area-inset-left,20px));
    bottom:max(20px,env(safe-area-inset-bottom,20px));width:120px;height:120px;pointer-events:auto;}
  #joystick-base{position:absolute;inset:0;border-radius:50%;background:rgba(30,60,45,0.35);border:2px solid rgba(57,255,138,0.35);}
  #joystick-stick{position:absolute;width:50px;height:50px;border-radius:50%;background:rgba(57,255,138,0.35);
    border:2px solid rgba(57,255,138,0.6);left:50%;top:50%;transform:translate(-50%,-50%);}



  #action-buttons{position:absolute;right:max(16px,env(safe-area-inset-right,16px));
    bottom:max(16px,env(safe-area-inset-bottom,16px));width:180px;height:150px;pointer-events:none;}
  .abtn{position:absolute;border-radius:50%;background:var(--panel);border:1.5px solid var(--green-dim);
    display:flex;align-items:center;justify-content:center;pointer-events:auto;transition:transform 0.08s,background 0.08s;}
  .abtn.active{transform:scale(0.88);background:#173a25;border-color:var(--green);}
  .abtn svg{width:50%;height:50%;stroke:var(--green);fill:none;stroke-width:2;}
  #btn-jump{width:64px;height:64px;right:0;bottom:0;}
  #btn-attack{width:74px;height:74px;right:74px;bottom:6px;}
  #btn-special{width:56px;height:56px;right:16px;bottom:82px;border-color:#1c6bb0;}
  #btn-special svg{stroke:var(--energy);}
  #btn-special.cooldown{opacity:0.35;}

  #veh-btn{position:absolute;left:max(20px,env(safe-area-inset-left,20px));bottom:calc(max(20px,env(safe-area-inset-bottom,20px)) + 190px);
    height:44px;padding:0 16px 0 12px;border-radius:22px;display:none;align-items:center;gap:8px;pointer-events:auto;z-index:25;
    background:rgba(10,18,15,.72);border:2px solid rgba(57,255,138,.7);color:#dfffee;font-size:12px;font-weight:700;letter-spacing:1.5px;
    box-shadow:0 0 12px rgba(57,255,138,.35);transition:transform .08s,background .12s,opacity .12s;}
  #veh-btn svg{width:24px;height:24px;stroke:#39ff8a;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  #veh-btn.active{transform:scale(.92);background:rgba(57,255,138,.25);}
  #veh-btn.exit{border-color:rgba(255,190,80,.85);box-shadow:0 0 12px rgba(255,170,60,.4);}
  #veh-btn.exit svg{stroke:#ffbe50;}
  #veh-hud{position:absolute;top:max(10px,env(safe-area-inset-top,10px));left:50%;transform:translateX(-50%);display:none;align-items:center;gap:10px;
    padding:6px 14px;border-radius:16px;background:rgba(8,14,12,.68);border:1px solid rgba(57,255,138,.45);color:#dfffee;font-size:11px;
    letter-spacing:1.5px;font-weight:700;pointer-events:none;z-index:24;}
  #veh-hud .vtrack{width:70px;height:7px;border-radius:4px;background:rgba(255,255,255,.14);overflow:hidden;}
  #veh-hud .vtrack i{display:block;height:100%;width:100%;background:#39ff8a;transition:background .2s;}
  body.driving #actions,body.driving #lock-btn,body.driving #btn-special,body.driving #hotbar{display:none !important;}
  body.driving #btn-attack svg{display:none;}
  body.driving #btn-attack::after{content:'HORN';font-size:11px;font-weight:700;letter-spacing:1px;color:var(--green);}
  body.driving #btn-jump svg{display:none;}
  body.driving #btn-jump::after{content:'BRAKE';font-size:10px;font-weight:700;letter-spacing:1px;color:var(--green);}
  #status-text{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);color:#fff;font-size:12px;
    opacity:0;letter-spacing:1px;pointer-events:none;}
  #status-text.show{opacity:0.85;transition:opacity 0.2s;}

  #death-screen{position:fixed;inset:0;background:#000;z-index:70;display:none;align-items:center;justify-content:center;
    color:var(--danger);font-size:22px;letter-spacing:5px;}
  #actions{position:absolute;right:max(204px,calc(env(safe-area-inset-right,0px) + 204px));bottom:16px;width:118px;display:flex;flex-direction:row-reverse;flex-wrap:wrap-reverse;gap:8px;pointer-events:none;}
  .act{position:relative;width:54px;height:54px;font-size:9px;letter-spacing:.5px;color:var(--energy);text-align:center;line-height:1.1;border-color:#1c6bb0;}
  .act.cooldown{opacity:.35;}
  #slow-overlay{position:fixed;inset:0;pointer-events:none;z-index:50;opacity:0;transition:opacity .3s;box-shadow:inset 0 0 160px 40px rgba(40,183,255,.45);background:rgba(40,120,255,.08);}

  /* ---- game-style controls ---- */
  #hotbar{display:none !important;}
  #actions{z-index:20;}
  #actions{right:max(16px,env(safe-area-inset-right,16px));bottom:176px;width:128px;gap:8px;}
  .abtn{background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.4),rgba(255,255,255,0) 42%),linear-gradient(160deg,#23704a,#082014);
    border:3px solid #39ff8a;
    box-shadow:0 0 0 2px #03100a,0 0 16px rgba(57,255,138,.55),inset 0 -7px 10px rgba(0,0,0,.5),inset 0 4px 6px rgba(255,255,255,.25);}
  .abtn svg{stroke:#eafff2;stroke-width:2.4;filter:drop-shadow(0 0 4px #39ff8a);}
  .abtn.active{transform:scale(.88);filter:brightness(1.5);}
  #btn-attack{background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.4),rgba(255,255,255,0) 42%),linear-gradient(160deg,#c8481c,#3d0f04);
    border-color:#ffa04a;box-shadow:0 0 0 2px #100300,0 0 18px rgba(255,140,60,.65),inset 0 -8px 12px rgba(0,0,0,.5),inset 0 4px 6px rgba(255,255,255,.25);}
  #btn-attack svg{filter:drop-shadow(0 0 4px #ff8a3a);}
  #btn-special{background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.4),rgba(255,255,255,0) 42%),linear-gradient(160deg,#5a2fb8,#150838);
    border-color:#b48aff;box-shadow:0 0 0 2px #06021a,0 0 16px rgba(160,110,255,.6),inset 0 -6px 10px rgba(0,0,0,.5),inset 0 4px 6px rgba(255,255,255,.25);}
  #btn-special svg{stroke:#f1e8ff;filter:drop-shadow(0 0 4px #b48aff);}
  .act{width:58px;height:58px;border-radius:18px;flex-direction:column;gap:1px;color:#eaffff;
    background:radial-gradient(circle at 30% 18%,rgba(255,255,255,.45),rgba(255,255,255,0) 45%),linear-gradient(160deg,#1c8fd6,#08213f);
    border:3px solid #6fe3ff;
    box-shadow:0 0 0 2px #020b16,0 0 14px rgba(70,200,255,.6),inset 0 -7px 10px rgba(0,0,0,.5),inset 0 4px 6px rgba(255,255,255,.3);
    animation:actglow 2.2s ease-in-out infinite;}
  .act i{font-style:normal;font-size:21px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.6));}
  .act b{font-size:8px;letter-spacing:.8px;font-weight:800;text-shadow:0 1px 0 #000,0 0 6px rgba(0,0,0,.8);}
  .act.cooldown{filter:grayscale(.9) brightness(.55);animation:none;opacity:1;}
  @keyframes actglow{50%{box-shadow:0 0 0 2px #020b16,0 0 24px rgba(70,200,255,.95),inset 0 -7px 10px rgba(0,0,0,.5),inset 0 4px 6px rgba(255,255,255,.3);}}
  @media (max-height:430px){ #actions{bottom:158px;width:112px;} .act{width:50px;height:50px;} .act i{font-size:17px;} }
  #squad-panel{position:absolute;right:max(10px,env(safe-area-inset-right,10px));top:max(10px,env(safe-area-inset-top,10px));z-index:30;display:none;align-items:center;gap:5px;pointer-events:auto;flex-wrap:nowrap;}
  .chip{position:relative;width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    background:rgba(10,18,15,.55);backdrop-filter:blur(3px);color:#cdeee0;font-size:10px;font-weight:800;letter-spacing:.2px;
    border:2px solid rgba(57,255,138,.55);}
  .chip::after{content:'';position:absolute;inset:-3px;border-radius:50%;border:2px solid transparent;
    background:conic-gradient(#3aff8f calc(var(--hp,100)*1%),rgba(255,255,255,.12) 0) border-box;
    -webkit-mask:linear-gradient(#000 0 0) padding-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;}
  .chip.sel{background:rgba(58,255,143,.28);border-color:#eafff2;box-shadow:0 0 10px rgba(57,255,138,.7);}
  .chip .hb,.chip .hf{display:none;}
  .chip.mode{width:auto;height:30px;padding:0 10px;border-radius:15px;font-size:9px;border-color:rgba(111,227,255,.5);color:#d8f4ff;}
  .chip.mode::after{display:none;}
  .chip.mode.on{background:rgba(28,143,214,.5);border-color:#6fe3ff;box-shadow:0 0 10px rgba(70,200,255,.7);}
  @media (orientation:portrait){ #squad-panel{top:242px;} }

  /* ---- STAGE 6: LOCK-ON ---- */
  #lock-btn{position:absolute;left:max(20px,env(safe-area-inset-left,20px));bottom:calc(max(20px,env(safe-area-inset-bottom,20px)) + 132px);
    width:46px;height:46px;border-radius:50%;pointer-events:auto;display:flex;align-items:center;justify-content:center;
    background:rgba(10,18,15,.6);border:2px solid rgba(255,90,90,.55);transition:transform .08s,background .12s,border-color .12s,opacity .12s;}
  #lock-btn svg{width:58%;height:58%;stroke:#ffb0b0;fill:none;stroke-width:2.2;}
  #lock-btn.on{background:rgba(255,60,60,.35);border-color:#ff6a6a;box-shadow:0 0 12px rgba(255,80,80,.7);}
  #lock-btn.on svg{stroke:#fff;}
  #lock-btn.active{transform:scale(.88);}
  #lock-btn.disabled{opacity:.3;}
  #lock-marker{position:fixed;left:0;top:0;width:56px;height:56px;margin:-28px 0 0 -28px;z-index:16;pointer-events:none;display:none;
    will-change:transform;}
  #lock-marker svg{width:100%;height:100%;overflow:visible;animation:lockspin 3.2s linear infinite;}
  #lock-marker .brk{stroke:#ff4a4a;stroke-width:3;fill:none;stroke-linecap:round;filter:drop-shadow(0 0 4px rgba(255,60,60,.9));}
  #lock-marker.pop svg{animation:lockpop .28s ease-out, lockspin 3.2s linear .28s infinite;}
  #lock-marker.edge svg{opacity:.85;}
  #lock-hp{position:absolute;left:50%;top:100%;width:46px;height:5px;margin:2px 0 0 -23px;background:rgba(0,0,0,.65);border:1px solid rgba(255,90,90,.6);}
  #lock-hp i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff3a3a,#ffa04a);}
  #lock-name{position:absolute;left:50%;top:100%;margin:9px 0 0 0;transform:translateX(-50%);font-size:9px;letter-spacing:1.2px;color:#ffd0d0;text-shadow:0 1px 2px #000;white-space:nowrap;font-weight:700;}
  @keyframes lockspin{to{transform:rotate(360deg);}}
  @keyframes lockpop{0%{transform:scale(2.4);opacity:0;}100%{transform:scale(1);opacity:1;}}

  /* ============================ HUD v2 ============================ */
  :root{--theme:#39ff8a;}
  #start-screen{background:radial-gradient(ellipse at 50% 28%,#0e4128 0%,#04140d 58%,#000 100%);overflow:hidden;}
  #start-screen::before{content:'';position:absolute;inset:0;background-image:linear-gradient(rgba(57,255,138,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(57,255,138,.08) 1px,transparent 1px);background-size:34px 34px;-webkit-mask-image:linear-gradient(#000,transparent 88%);mask-image:linear-gradient(#000,transparent 88%);pointer-events:none;}
  #logo-hex{width:64px;height:64px;filter:drop-shadow(0 0 12px rgba(57,255,138,.7));margin-bottom:2px;position:relative;}
  #start-screen h1{font-size:40px;letter-spacing:7px;margin:0;position:relative;}
  #start-screen .sub{letter-spacing:6px;font-size:11px;opacity:.75;margin:2px 0 20px;position:relative;color:#bfffe0;}
  .menu-btn{position:relative;width:250px;background:linear-gradient(180deg,rgba(25,80,52,.9),rgba(6,26,17,.95));border:1px solid var(--green);font-weight:700;}
  .menu-btn:active{background:linear-gradient(180deg,#2a8a58,#0c3a24);color:#fff;}
  #start-screen .foot{position:relative;margin-top:16px;font-size:10px;letter-spacing:4px;opacity:.55;}

  #hud #alien-card{width:232px;padding:6px 12px 8px 8px;background:linear-gradient(135deg,rgba(5,26,18,.93),rgba(3,14,10,.82));border:1px solid var(--theme);cursor:pointer;}
  #hud #alien-portrait-wrap{gap:10px;}
  #hud #alien-portrait{width:58px;height:66px;border:none;background:var(--theme);padding:2px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);}
  #hud #alien-portrait canvas{width:100%;height:100%;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:radial-gradient(circle at 50% 40%,#12402c,#04120c);}
  #hud #alien-name{font-size:15px;letter-spacing:1.5px;color:var(--theme);text-shadow:0 0 8px rgba(0,0,0,.6);}
  #alien-tag{font-size:8px;letter-spacing:1px;color:#b9e8cf;opacity:.85;margin-top:2px;white-space:nowrap;}
  #hud .bar-row{margin-top:4px;}
  #hud .bar-track{height:7px;border-radius:2px;background:rgba(255,255,255,.1);}
  #hud .bar-label{font-size:8px;width:22px;letter-spacing:.8px;}
  #hud .ident{min-width:0;}

  #minimap{position:absolute;right:max(12px,env(safe-area-inset-right,12px));top:max(10px,env(safe-area-inset-top,10px));width:92px;height:92px;border-radius:50%;border:2px solid var(--theme);background:#04120c;box-shadow:0 0 10px rgba(0,0,0,.6);pointer-events:none;}
  #squad-panel{right:118px !important;top:max(12px,env(safe-area-inset-top,12px)) !important;}

  /* --- right cluster: attack / jump / powers in an arc around the thumb (CODM style) --- */
  #hud #action-buttons{position:absolute;inset:0;width:auto;height:auto;right:auto;bottom:auto;pointer-events:none;}
  #hud #btn-attack{width:84px;height:84px;right:26px;bottom:max(24px,env(safe-area-inset-bottom,24px));}
  #hud #btn-jump{width:64px;height:64px;right:36px;bottom:calc(max(24px,env(safe-area-inset-bottom,24px)) + 104px);}
  #hud #btn-special{width:60px;height:60px;right:124px;bottom:max(24px,env(safe-area-inset-bottom,24px));border-color:var(--theme);}
  #hud #btn-special svg{stroke:var(--theme);}
  #hud #actions{position:absolute;inset:0;width:auto;right:auto;bottom:auto;display:block;pointer-events:none;flex-wrap:nowrap;}
  #hud .act{position:absolute;width:56px;height:56px;border-radius:50%;border:2px solid var(--theme);color:var(--theme);gap:0;justify-content:center;

  #omni-dial::before{content:'';position:absolute;left:50px;top:50px;width:200px;height:200px;border-radius:50%;border:2px solid rgba(57,255,138,.55);background:radial-gradient(circle,rgba(4,30,18,.85),rgba(2,12,8,.9));box-shadow:0 0 28px rgba(57,255,138,.35),inset 0 0 20px rgba(57,255,138,.2);}

<script src="three.min.js"></script>
<script>
(function(){
'use strict';
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

/* =========================================================================
   AUDIO — lightweight generated sfx (no external files)
========================================================================= */
const Audio_ = (function(){
  let ctx = null;
  function ac(){ if(!ctx){ try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return ctx; }

  // Real audio files: dropped into a "sounds/" folder next to index.html.
  // Missing files fail silently (caught) so the game still runs without them.
  const musicTracks = ['sounds/back1.mp3', 'sounds/back2.mp3'];
  let musicEls = [], curTrack = -1, musicVol = 0.35;
  function initMusic(){
    if(musicEls.length) return;
    musicEls = musicTracks.map(src=>{
      const a = new Audio(src); a.preload='auto'; a.volume=musicVol;
      a.addEventListener('error', ()=>{}, true);
      return a;
    });
  }
  function playNextTrack(){
    if(!musicEls.length) return;
    curTrack = (curTrack+1) % musicEls.length;
    const el = musicEls[curTrack];
    el.currentTime = 0;
    el.play().catch(()=>{});
    el.onended = playNextTrack;
  }
  function stopMusic(){ musicEls.forEach(a=>{ try{ a.pause(); }catch(e){} }); }

  const mutateSfx = new Audio('sounds/mutate.mp3');
  mutateSfx.preload = 'auto'; mutateSfx.volume = 0.7;
  mutateSfx.addEventListener('error', ()=>{}, true);
  function playMutate(){ try{ mutateSfx.currentTime = 0; mutateSfx.play().catch(()=>{}); }catch(e){} }
  // ---- optional real recordings: drop sounds/<name>.mp3 next to index.html and it replaces the synth version ----
  const SAMPLE_NAMES=['punch','hit','heavy','footstep','crash','explosion','horn','jump','land','scream','timeout','ambient','engine'];
  const samples={};
  SAMPLE_NAMES.forEach(n=>{ try{ const el=new Audio('sounds/'+n+'.mp3'); el.preload='auto'; samples[n]={el,ok:false};
    el.addEventListener('canplaythrough',()=>{ samples[n].ok=true; }); el.addEventListener('error',()=>{ samples[n].ok=false; },true); }catch(e){} });
  function sample(n,vol,rate){ const s_=samples[n]; if(!s_||!s_.ok) return false;
    try{ const c=s_.el.cloneNode(); c.volume=Math.max(0,Math.min(1,vol==null?.8:vol)); if(rate) c.playbackRate=rate; c.play().catch(()=>{}); return true; }catch(e){ return false; } }
  const sfxVol=()=>1;
  function beep(freq, dur, type, vol, glideTo){
    try{ const a = ac(); if(!a) return;
      const o = a.createOscillator(); const g = a.createGain();
      o.type = type||'sine'; o.frequency.setValueAtTime(freq, a.currentTime);
      if(glideTo) o.frequency.exponentialRampToValueAtTime(glideTo, a.currentTime+dur);
      g.gain.setValueAtTime(vol||0.15, a.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, a.currentTime+dur);
      o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur); }catch(e){}
  }
  let noiseBuf=null;
  function nbuf(){ const a=ac(); if(!a) return null; if(!noiseBuf){ noiseBuf=a.createBuffer(1,a.sampleRate*2,a.sampleRate); const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; } return noiseBuf; }
  // filtered noise burst: the body of footsteps, whooshes, impacts, explosions. f0->f1 sweeps the filter.
  function nz(dur, vol, f0, f1, type, q){
    try{ const a=ac(); if(!a) return; const buf=nbuf(); if(!buf) return;
      const src=a.createBufferSource(); src.buffer=buf; src.loop=true;
      const fl=a.createBiquadFilter(); fl.type=type||'lowpass'; fl.Q.value=q||.8; fl.frequency.setValueAtTime(f0||1000,a.currentTime);
      if(f1) fl.frequency.exponentialRampToValueAtTime(f1,a.currentTime+dur);
      const g=a.createGain(); g.gain.setValueAtTime(0.0001,a.currentTime); g.gain.exponentialRampToValueAtTime(vol||.2,a.currentTime+Math.min(.02,dur*.3)); g.gain.exponentialRampToValueAtTime(0.001,a.currentTime+dur);
      src.connect(fl); fl.connect(g); g.connect(a.destination); src.start(a.currentTime,Math.random()); src.stop(a.currentTime+dur+.02); }catch(e){}
  }
  const thump=(f,dur,vol)=>beep(f,dur,'sine',vol,Math.max(20,f*.4));
  // ---- persistent loops: engine, tyre screech, ambience ----
  let eng=null, scr=null, amb=null;
  function ensureEngine(){ const a=ac(); if(!a||eng) return eng;
    try{ const o1=a.createOscillator(), o2=a.createOscillator(), fl=a.createBiquadFilter(), g=a.createGain();
      o1.type='sawtooth'; o2.type='square'; fl.type='lowpass'; fl.frequency.value=520; g.gain.value=0;
      o1.connect(fl); o2.connect(fl); fl.connect(g); g.connect(a.destination); o1.start(); o2.start(); eng={o1,o2,fl,g}; }catch(e){ eng=null; }
    return eng; }
  function ensureScreech(){ const a=ac(); if(!a||scr) return scr;
    try{ const buf=nbuf(); const src=a.createBufferSource(); src.buffer=buf; src.loop=true; const fl=a.createBiquadFilter(); fl.type='bandpass'; fl.frequency.value=2300; fl.Q.value=4; const g=a.createGain(); g.gain.value=0;
      src.connect(fl); fl.connect(g); g.connect(a.destination); src.start(); scr={g}; }catch(e){ scr=null; }
    return scr; }
  function startAmbient(){ const a=ac(); if(!a||amb) return;
    try{ if(samples.ambient&&samples.ambient.ok){ samples.ambient.el.loop=true; samples.ambient.el.volume=.35; samples.ambient.el.play().catch(()=>{}); amb={sample:true}; return; }
      const buf=nbuf(); const src=a.createBufferSource(); src.buffer=buf; src.loop=true; const fl=a.createBiquadFilter(); fl.type='lowpass'; fl.frequency.value=260; const g=a.createGain(); g.gain.value=.035;
      const lfo=a.createOscillator(), lg=a.createGain(); lfo.frequency.value=.13; lg.gain.value=.02; lfo.connect(lg); lg.connect(g.gain); lfo.start();
      src.connect(fl); fl.connect(g); g.connect(a.destination); src.start(); amb={g};
      setInterval(()=>{ if(Math.random()<.55){ const f=2300+Math.random()*1400; beep(f,.07,'sine',.012,f*1.25); setTimeout(()=>beep(f*1.1,.06,'sine',.01,f*1.4),110); } },6500);
    }catch(e){} }
  return {
    footstep(fast){ if(sample('footstep',.35,.9+Math.random()*.2)) return; nz(.075,fast?.09:.06,300+Math.random()*350,120,'lowpass',.7); if(fast) thump(78,.06,.05); },
    horn(){ if(sample('horn',.7)) return; beep(330,.28,'square',.07); setTimeout(()=>beep(415,.28,'square',.05),10); },
    crash(){ if(sample('crash',.9)) return; nz(.4,.34,1400,120,'lowpass',.7); thump(60,.3,.3); beep(180,.12,'square',.05,60); },
    explosion(){ if(sample('explosion',1)) return; nz(.9,.4,900,60,'lowpass',.6); thump(46,.7,.42); },
    jump(){ if(sample('jump',.5)) return; nz(.14,.05,500,1400,'bandpass',1.2); thump(190,.12,.06); },
    land(v){ if(sample('land',.5)) return; const k=Math.min(1,(v||8)/20); nz(.12+.1*k,.1+.12*k,420,90,'lowpass'); thump(70,.14,.1+.15*k); },
    breakBlock(){ nz(.16,.2,1800,300,'bandpass',.9); },
    place(){ thump(160,.08,.1); },
    attack(){ if(sample('punch',.5)) return; nz(.13,.12,500,2000,'bandpass',1.4); },
    heavyHit(){ if(sample('heavy',.9)) return; thump(80,.3,.4); nz(.18,.28,700,90,'lowpass',.8); beep(240,.06,'square',.07,90); },
    hit(){ if(sample('hit',.8)) return; thump(150,.1,.24); nz(.07,.2,2400,700,'bandpass',1.1); },
    transform(){ beep(220,.35,'sine',.18,880); setTimeout(()=>beep(880,.2,'sine',.15,440),120); playMutate(); },
    special(){ beep(400,.3,'sawtooth',.18,700); nz(.25,.08,900,3000,'bandpass',2); },
    scream(){ if(sample('scream',.8)) return; beep(1300,.55,'sawtooth',.14,300); beep(1750,.5,'square',.06,420); nz(.5,.1,4000,800,'bandpass',2); },
    death(){ beep(400,.6,'sawtooth',.2,60); thump(60,.5,.3); },
    click(){ beep(900,.04,'square',.05,600); },
    hurt(){ thump(110,.14,.3); nz(.09,.16,1500,400,'bandpass',1); beep(260,.12,'sawtooth',.06,140); },
    heartbeat(){ thump(62,.12,.28); setTimeout(()=>thump(54,.14,.2),170); },
    deny(){ beep(180,.16,'square',.08,120); },
    warn(){ beep(1200,.09,'square',.06); setTimeout(()=>beep(1200,.09,'square',.06),140); },
    timeout(){ if(sample('timeout',.8)) return; beep(900,.5,'sawtooth',.13,90); thump(70,.4,.25); },
    // engine: sr = 0..1 fraction of top speed, thr = 0..1 throttle. Fake gearbox so it revs up, drops, revs again.
    engine(sr,thr){ const e=ensureEngine(); const a=ac(); if(!e||!a) return; const t=a.currentTime;
      const gear=Math.min(4,Math.floor(sr*5)), inG=sr*5-gear, rpm=Math.max(inG,thr*.3), f=48+gear*8+rpm*82;
      e.o1.frequency.setTargetAtTime(f,t,.06); e.o2.frequency.setTargetAtTime(f*.5,t,.06); e.fl.frequency.setTargetAtTime(340+rpm*700+thr*260,t,.08);
      e.g.gain.setTargetAtTime(.028+thr*.05+sr*.02,t,.1); },
    engineOff(){ if(eng){ const a=ac(); if(a) eng.g.gain.setTargetAtTime(0,a.currentTime,.12); } if(scr){ const a=ac(); if(a) scr.g.gain.setTargetAtTime(0,a.currentTime,.05); } },
    screech(k){ const s_=ensureScreech(); const a=ac(); if(!s_||!a) return; s_.g.gain.setTargetAtTime(Math.max(0,Math.min(.09,k*.09)),a.currentTime,.05); },
    resume(){
      const a=ac(); if(a && a.state==='suspended') a.resume();
      initMusic(); startAmbient();
      if(curTrack===-1) playNextTrack();
    },
    setMusicVolume(v){ musicVol=v; musicEls.forEach(a=>a.volume=v); },
    stopMusic, playNextTrack
  };
})();

/* =========================================================================
   GRAPHICS QUALITY
========================================================================= */
const QUALITY = { level:'MEDIUM',
  presets:{
    LOW:{shadow:false,shadowSize:512,fogFar:44,pixelRatio:1,renderDist:22},
    MEDIUM:{shadow:true,shadowSize:1024,fogFar:70,pixelRatio:Math.min(devicePixelRatio,1.5),renderDist:32},
    HIGH:{shadow:true,shadowSize:2048,fogFar:100,pixelRatio:Math.min(devicePixelRatio,2),renderDist:42}
  }
};

/* =========================================================================
   RENDERER / SCENE / CAMERA
========================================================================= */
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 400);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const ambient = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xfff3d0, 1.0);
sun.castShadow = true;
scene.add(sun);
scene.add(sun.target);

function applyQuality(){
  const p = QUALITY.presets[QUALITY.level];
  renderer.setPixelRatio(p.pixelRatio);
  renderer.shadowMap.enabled = p.shadow;
  sun.castShadow = p.shadow;
  sun.shadow.mapSize.set(p.shadowSize, p.shadowSize);
  sun.shadow.camera.left=-45; sun.shadow.camera.right=45;
  sun.shadow.camera.top=45; sun.shadow.camera.bottom=-45;
  sun.shadow.camera.far=120;
  scene.fog = new THREE.Fog(0x8fc7f2, 14, p.fogFar);
}
applyQuality();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Declared here (ahead of the terrain/chunk system) because chunk generation spawns
// parked cars via makeBoulder(), which needs DEB and props to already exist.
const props=[], fx=[], actCd={}; let carried=null, timeScale=1, tornado=null, actEls=[];
const DEB=new THREE.BoxGeometry(1,1,1);

/* =========================================================================
   WORLD / VOXEL TERRAIN  —  CHUNK STREAMING
   The world is logically WORLD x WORLD columns, but nothing is generated
   or held in memory until the player gets near it. Chunks are CHUNK x CHUNK

function generateChunk(cx, cz){

    let n=0;
    mkPts.forEach(([mx,my,mz])=>{
      dummy.scale.set(.25,.05,1.6); dummy.position.set(x0+0.5,my,mz); dummy.updateMatrix(); rm.setMatrixAt(n++,dummy.matrix);

    const leafI = new THREE.InstancedMesh(new THREE.BoxGeometry(2.2,2.2,2.2), leafMat, spots.length);
    spots.forEach((s,n)=>{
      dummy.scale.set(1,1,1); dummy.position.set(s[0],GY+1.1,s[1]); dummy.updateMatrix(); trunkI.setMatrixAt(n,dummy.matrix);
      dummy.position.y=GY+2.9; dummy.updateMatrix(); leafI.setMatrixAt(n,dummy.matrix);

}

function disposeChunk(chunk){
  // Only remove the InstancedMesh from the scene — geometry and material are shared across
  // every chunk now (see blockMaterials/sharedBoxGeo above), so they must never be disposed here.
  Object.values(chunk.meshes).forEach(m=>{ scene.remove(m); });
  chunk.props.meshes.forEach(m=>{ if(m.parent) m.parent.remove(m); if(m.geometry&&m.geometry!==UB) m.geometry.dispose(); if(m.material&&!Array.isArray(m.material)&&m.material!==railMat){ if(m.material.map) m.material.map.dispose(); m.material.dispose(); } });
  chunk.props.colliders.forEach(c=>{ const i=colliders.indexOf(c); if(i>=0) colliders.splice(i,1); });
  if(chunk.props.carRef && !chunk.props.carRef.driver && chunk.props.carRef!==carried){ removeVehicle(chunk.props.carRef); }
  // clear this chunk's block registry entries (terrain memory is freed; columnHeight persists so ground queries outside load radius still resolve sanely)
  const x0 = chunk.cx*CHUNK - HALF, z0 = chunk.cz*CHUNK - HALF;
  for(let lx=0; lx<CHUNK; lx++) for(let lz=0; lz<CHUNK; lz++){
    for(let y=-14;y<=20;y++){ const k=keyOf(x0+lx,y,z0+lz); if(blocks.has(k)) blocks.delete(k); }
  }
  chunks.delete(chunk.key);
}

// Loads/unloads chunks around (px,pz). Cheap to call every frame — it only queues work when the
// player has crossed into a new chunk, and actual generation is budgeted (a few chunks per frame)
// so fast movement (XLR8, rolling Cannonbolt, flying Heatblast) never stalls a single frame by
// generating many chunks at once. Missing chunks are queued nearest-first so the ground/buildings
// immediately around the player are always the first to appear.
const loadQueue = [];
const queuedKeys = new Set();
const CHUNKS_PER_FRAME = 2;      // baseline budget when standing/walking
const MAX_CHUNKS_PER_FRAME = 5;  // ceiling at extreme speed - bounded so one frame can never freeze the phone
const LOOKAHEAD_MAX = 3;         // extra chunks to reach ahead of the player at full speed (on top of LOAD_RADIUS)

// Track the player's actual movement (derived from position deltas) so streaming can be biased toward
// where they are heading rather than loading a symmetric square around where they currently stand.
let prevStreamX = null, prevStreamZ = null, velX = 0, velZ = 0, lastStreamKey = '';

function updateChunkStreaming(px,pz,dt){
  // --- estimate velocity (smoothed) ---
  if(prevStreamX !== null && dt > 0){
    const vx = (px-prevStreamX)/dt, vz = (pz-prevStreamZ)/dt;
    velX += (vx-velX)*Math.min(1, dt*8); velZ += (vz-velZ)*Math.min(1, dt*8);
  }
  prevStreamX = px; prevStreamZ = pz;
  const speed = Math.hypot(velX, velZ);
  const dirX = speed>0.5 ? velX/speed : 0, dirZ = speed>0.5 ? velZ/speed : 0;
  // 0 at walking pace, 1 at ~60 units/sec (full XLR8 speed)
  const speedFrac = Math.max(0, Math.min(1, (speed-8)/50));

  const [ccx,ccz] = chunkCoordOf(px,pz);
  // Re-plan when the chunk changes OR the heading meaningfully changes (bucketed to avoid re-planning every frame).
  const headingBucket = speedFrac>0.05 ? Math.round(Math.atan2(dirZ,dirX)/0.6)+':'+Math.round(speedFrac*3) : 'still';
  const planKey = ccx+','+ccz+'|'+headingBucket;

  if(planKey !== lastStreamKey || chunks.size===0){
    lastStreamKey = planKey;
    curChunkX = ccx; curChunkZ = ccz;

    // How far ahead to reach: further at higher speed. Chunk units.
    const ahead = Math.round(LOOKAHEAD_MAX*speedFrac);
    const reach = LOAD_RADIUS + ahead;

    const missing = [];
    for(let dx=-reach; dx<=reach; dx++){
      for(let dz=-reach; dz<=reach; dz++){
        const cx=ccx+dx, cz=ccz+dz, key=chunkKeyOf(cx,cz);
        // Chunks beyond the normal radius are only wanted if they lie in the forward direction.
        const chebyshev = Math.max(Math.abs(dx),Math.abs(dz));
        if(chebyshev > LOAD_RADIUS){
          const len = Math.hypot(dx,dz)||1;
          const alignment = (dx/len)*dirX + (dz/len)*dirZ; // 1 = dead ahead, -1 = directly behind
          if(alignment < 0.55) continue;
        }
        if(chunks.has(key) || queuedKeys.has(key)) continue;
        // Priority: how soon we'll reach it. Chunks ahead of us are pulled forward in the queue;
        // chunks behind us are pushed back (they matter least when moving fast).
        const dist2 = dx*dx+dz*dz;
        const along = dx*dirX + dz*dirZ;              // positive = ahead
        const priority = dist2 - along*2.5*speedFrac*Math.abs(along) ;
        missing.push([cx,cz,priority]); queuedKeys.add(key);
      }
    }
    missing.sort((a,b)=>a[2]-b[2]);
    missing.forEach(([cx,cz])=>loadQueue.push([cx,cz]));

    // Re-sort the whole existing queue by the new heading so stale far-behind entries fall to the back.
    loadQueue.sort((a,b)=>{
      const ax=a[0]-ccx, az=a[1]-ccz, bx=b[0]-ccx, bz=b[1]-ccz;
      const pa=ax*ax+az*az-((ax*dirX+az*dirZ)*2.5*speedFrac*Math.abs(ax*dirX+az*dirZ));
      const pb=bx*bx+bz*bz-((bx*dirX+bz*dirZ)*2.5*speedFrac*Math.abs(bx*dirX+bz*dirZ));
      return pa-pb;
    });

    // Drop queued chunks that are now too far from us (bounded queue, even when sprinting in a line).
    const keepR = reach + 1;
    for(let i=loadQueue.length-1;i>=0;i--){
      const [cx,cz] = loadQueue[i];
      if(Math.abs(cx-ccx) > keepR || Math.abs(cz-ccz) > keepR){ queuedKeys.delete(chunkKeyOf(cx,cz)); loadQueue.splice(i,1); }
    }

    // Unload: distant chunks go, and behind-us chunks are released earlier when moving fast, so the
    // number of live chunks (and memory) stays bounded even though we're now reaching further ahead.
    const behindR = speedFrac>0.3 ? UNLOAD_RADIUS-1 : UNLOAD_RADIUS;
    for(const chunk of [...chunks.values()]){
      const dx = chunk.cx-ccx, dz = chunk.cz-ccz;
      const ahd = dx*dirX + dz*dirZ;
      const limit = ahd >= 0 ? UNLOAD_RADIUS+ahead : behindR;
      if(Math.abs(dx) > limit || Math.abs(dz) > limit) disposeChunk(chunk);
    }
  }

  // Budget scales with speed: more chunks per frame when moving fast, but hard-capped.
  const budget = Math.min(MAX_CHUNKS_PER_FRAME, CHUNKS_PER_FRAME + Math.round(speedFrac*(MAX_CHUNKS_PER_FRAME-CHUNKS_PER_FRAME)));
  for(let i=0;i<budget && loadQueue.length;i++){
    const [cx,cz] = loadQueue.shift();
    const key = chunkKeyOf(cx,cz);
    queuedKeys.delete(key);
    if(!chunks.has(key)) generateChunk(cx,cz);
  }
}
// Used once at startup only: generates every currently-queued chunk immediately (a one-time loading
// pause is fine before the player can even see or move), so the spawn area is fully solid on frame one.
function drainChunkQueueFully(){
  while(loadQueue.length){
    const [cx,cz] = loadQueue.shift();
    const key = chunkKeyOf(cx,cz);
    queuedKeys.delete(key);
    if(!chunks.has(key)) generateChunk(cx,cz);
  }
}

// Returns the Y of the walkable surface (top face of the highest solid block).
// Y of the walkable surface. With no feet height it is the terrain top (old behaviour, every existing caller).
// With fy it is the highest surface - terrain, roof, landing, ramp, pitched roof - that is at most a step above fy.
function groundTopAt(x,z,fy){
  const gx = Math.round(x), gz = Math.round(z);
  const t = columnHeight[colKey(gx,gz)];
  let best = Math.max(t===undefined ? -3 : t, -14) + 0.5;
  if(fy===undefined) return best;
  const lim = fy + STEP_UP;
  for(let i=colliders.length-1;i>=0;i--){
    const c=colliders[i];
    if(c.ladder||x<=c.x0||x>=c.x1||z<=c.z0||z>=c.z1) continue;
    let h=c.top;
    if(c.ramp){ const r=c.ramp, u=Math.max(0,Math.min(1,((r.ax==='z'?z:x)-r.s)/(r.e-r.s))); h=r.y0+(r.y1-r.y0)*u; }
    else if(c.pyr){ const q=c.pyr, m=Math.max(Math.abs(x-q.cx),Math.abs(z-q.cz)); h=q.y0+q.h*Math.max(0,1-m/q.hw); }
    if(h<=lim && h>best) best=h;
  }
  return best;
}

/* =========================================================================
   DAY / NIGHT CYCLE
========================================================================= */
const DAY_LENGTH = 240; // seconds per full cycle
let dayT = 0.25; // start mid-morning
const skyDay = new THREE.Color(0x8fc7f2), skyNight = new THREE.Color(0x0a1020);
const fogDay = new THREE.Color(0x8fc7f2), fogNight = new THREE.Color(0x0a1020);
function updateDayNight(dt){
  dayT = (dayT + dt/DAY_LENGTH) % 1;
  const angle = dayT * Math.PI * 2;
  sun.position.set(player.pos.x + Math.cos(angle)*60, Math.max(8,Math.sin(angle)*70), player.pos.z + Math.sin(angle)*30);
  sun.target.position.copy(player.pos);      // keep the shadow frustum centered on the player as they roam
  const light = Math.max(0.08, Math.sin(angle));
  const mix = THREE.MathUtils.clamp(light,0,1);
  scene.background = skyNight.clone().lerp(skyDay, mix);
  scene.fog.color.copy(fogNight.clone().lerp(fogDay, mix));
  ambient.intensity = 0.25 + 0.4*mix;
  sun.intensity = 0.3 + 0.9*mix;
}

   all share one system. Old part names (leftArm, rightArm, leftLeg, rightLeg, head, torso) still point at the

function buildRig(cfg){

  const all=Object.values(mats);

  const grp=(x,y,z)=>{ const g=new THREE.Group(); g.position.set(x||0,y||0,z||0); return g; };
  const g=new THREE.Group(), parts={mats,all};
  const hipY=C.legLen, thigh=C.legLen*.5, shin=C.legLen*.5;
  const hips=grp(0,hipY+.09,0); g.add(hips); parts.hips=hips; parts.hipY=hipY+.09; // +.09 so the soles (not the ankles) touch the ground
  hips.add(box(C.torsoW*.92,.22,C.torsoD*1.05,mats.bottom,0,.05,0)); // pelvis / belt
  const lsp=Math.max(.16,C.torsoW*.27);
  function leg(sx){
    const t=grp(sx*lsp,-.02,0); hips.add(t); t.add(box(C.legT,thigh,C.legT,mats.bottom,0,-thigh/2,0));
    const k=grp(0,-thigh,0); t.add(k); k.add(box(C.legT*.9,shin,C.legT*.9,mats.bottom,0,-shin/2,0));
    const a=grp(0,-shin,0); k.add(a); a.add(box(C.legT*1.05,.1,C.legT*1.55,mats.accent,0,-.02,-C.legT*.25));

  const chest=grp(0,.12,0); hips.add(chest); parts.chest=chest; parts.torso=chest;
  chest.add(box(C.torsoW,C.torsoH,C.torsoD,mats.top,0,C.torsoH/2,0)); parts.torsoMesh=chest.children[0];
  const shY=C.torsoH*.86;

  const ua=C.armLen*.5, fa=C.armLen*.5;

    sh.add(box(C.armT*1.25,C.armT*1.1,C.armT*1.25,mats.top,0,0,0)); // shoulder cap
    sh.add(box(C.armT,ua,C.armT,sm,0,-ua/2,0));
    const el=grp(0,-ua,0); sh.add(el); el.add(box(C.armT*.9,fa,C.armT*.9,mm,0,-fa/2,0));
    const hd=box(C.armT*1.25,C.armT*1.25,C.armT*1.25,mm,0,-fa-C.armT*.4,0); el.add(hd);
    return {sh,el,hd};
  }

  parts.leftArm=AL.sh; parts.rightArm=AR.sh; parts.elbowL=AL.el; parts.elbowR=AR.el; parts.handL=AL.hd; parts.handR=AR.hd;

    parts.leftArm2=BL.sh; parts.rightArm2=BR.sh; parts.elbow2L=BL.el; parts.elbow2R=BR.el;
  }
  parts.dims={hipY,torsoH:C.torsoH,headS:C.headS,total:hipY+C.torsoH+C.neck+C.headS*1.05+.12,torsoW:C.torsoW,torsoD:C.torsoD,armLen:C.armLen};
  parts.g=g; parts.anim={ph:0,spd:0,px:null,pz:null,t:Math.random()*10,air:0,land:0,wasGround:true,hit:0,lean:0,dead:0,vyS:0};

}

// tiny portrait renderer (renders each alien to a mini canvas for the HUD)
const portraitThumb={};
function renderPortrait(kind){
  const size = 128;
  const pr = new THREE.WebGLRenderer({antialias:true, alpha:true});
  pr.setSize(size,size);
  const psc = new THREE.Scene();
  psc.add(new THREE.AmbientLight(0xffffff,0.9));
  const pl = new THREE.DirectionalLight(0xffffff,0.8); pl.position.set(2,3,4); psc.add(pl);
  const model = buildCharacter(kind);
  model.rotation.y = Math.PI*0.18;
  model.position.y = -0.1;
  psc.add(model);
  const pD = model.userData.parts.dims, hy = model.position.y - 0.9 + pD.total*0.86;   // head height
  const tall = (kind==='heatblast'||kind==='diamondhead') ? 0.22 : 0;                                 // flames / crown need headroom
  const pcam = new THREE.PerspectiveCamera(32,1,0.1,10);
  pcam.position.set(0.15,hy+0.12+tall*.6,1.95+pD.total*0.16+tall); pcam.lookAt(0,hy-0.22+tall*.8,0);
  pr.render(psc, pcam);
  try{ const c2=document.createElement('canvas'); c2.width=c2.height=size; c2.getContext('2d').drawImage(pr.domElement,0,0); portraitThumb[kind]=c2.toDataURL(); }catch(e){}
  return pr.domElement;
}

/* =========================================================================
   STAGE 11 - OMNITRIX
   charge (0-100) is the time budget for alien forms. It drains while transformed (each alien has its own duration),
   recharges as Ben (after a short hold), warns at 10 s, counts down the last 3 s and reverts on empty followed by a
   brief lockout. You need OMNI_MIN charge to transform. Voluntary reverts keep the remaining charge.
   Settings > OMNITRIX TIMER: OFF disables the drain entirely for pure sandbox play.
========================================================================= */
var OMNI={charge:100,lock:0,hold:0,warned:0,tick:-1,enabled:true,open:false,openT:0,dialSync:0};
const OMNI_DUR={four_arms:85,heatblast:65,xlr8:60,diamondhead:80,echo_echo:75,cannonbolt:65};
const OMNI_MIN=25, OMNI_RECHARGE=20, OMNI_LOCK=2.5;
function tryTransform(def){
  if(!player.alive || def===player.form) return false;
  if(def!==BEN && OMNI.enabled){
    if(OMNI.lock>0){ statusText('OMNITRIX RECHARGING'); Audio_.deny(); return false; }
    if(OMNI.charge<OMNI_MIN){ statusText('OMNITRIX LOW  '+Math.floor(OMNI.charge)+'%  (NEED '+OMNI_MIN+'%)'); Audio_.deny(); return false; }
  }
  setForm(def, def.id);
  return true;
}
function cycleAlien(dir){
  const n=(player.alienIndex + dir + ALIENS.length) % ALIENS.length;
  if(tryTransform(ALIENS[n])) player.alienIndex=n;
}
function revertToBen(){
  if(player.form.id === 'ben') return;
  setForm(BEN, 'ben');
}
function omniTimeout(){
  OMNI.charge=0; OMNI.lock=OMNI_LOCK;
  bannerText('OMNITRIX TIMEOUT'); Audio_.timeout(); flashTransform(.5,'#ff3a3a');
  revertToBen(); if(typeof transformFx==='function'&&player.alive) transformFx(0xff5a4a);
}
function updateOmnitrix(dt){
  if(OMNI.lock>0) OMNI.lock=Math.max(0,OMNI.lock-dt);
  const alien = player.form!==BEN, card=document.getElementById('alien-card');
  if(alien && OMNI.enabled && player.alive){
    const dur=OMNI_DUR[player.form.id]||60;
    if(!OMNI.open) OMNI.charge=Math.max(0,OMNI.charge-dt*100/dur);           // the Omnitrix timer pauses while the dial is open
    const left=OMNI.charge*dur/100;
    if(left<=10 && OMNI.warned<1){ OMNI.warned=1; bannerText('OMNITRIX  10s'); Audio_.warn(); card.classList.add('warn'); }
    if(left<=3){ const c=Math.ceil(left); if(c!==OMNI.tick && c>0){ OMNI.tick=c; Audio_.warn(); statusText('REVERTING IN '+c); } }
    if(OMNI.charge<=0) omniTimeout();
  } else if(!alien){
    OMNI.hold=Math.max(0,OMNI.hold-dt);
    if(OMNI.hold<=0 && OMNI.charge<100) OMNI.charge=Math.min(100,OMNI.charge+dt*100/OMNI_RECHARGE);
  }
  const f=document.getElementById('omni-fill'); if(f) f.style.width=(OMNI.enabled?OMNI.charge:100)+'%';
  card.classList.toggle('locked', OMNI.enabled && !alien && (OMNI.lock>0||OMNI.charge<OMNI_MIN));
  if(OMNI.open){ OMNI.openT-=dt; OMNI.dialSync-=dt; if(OMNI.openT<=0) closeDial(); else if(OMNI.dialSync<=0){ OMNI.dialSync=.2; syncDial(); } }
}
// ---- radial selector: tap the portrait; Ben / Omnitrix in the middle, the six aliens around the ring ----
const DIAL_SHORT={ben:'BEN',four_arms:'4 ARMS',heatblast:'HEATBLAST',xlr8:'XLR8',diamondhead:'DIAMOND',echo_echo:'ECHO ECHO',cannonbolt:'CANNONBOLT'};
function buildDial(){
  const d=document.getElementById('omni-dial'); d.innerHTML='';
  const defs=[BEN].concat(ALIENS);
  defs.forEach((def,i)=>{
    const el=document.createElement('div'); el.className='od'+(i?'':' center'); el.dataset.id=def.id;
    const cx=150, cy=150, R=104, ang=(-90+(i-1)*60)*Math.PI/180;
    el.style.left=(i?cx+Math.cos(ang)*R:cx)+'px'; el.style.top=(i?cy+Math.sin(ang)*R:cy)+'px'; el.style.setProperty('--c',FORM_THEME[def.id]);
    const inn=document.createElement('div'); inn.className='in'; el.appendChild(inn);
    if(i){ const img=document.createElement('img'); if(portraitThumb[def.id]) img.src=portraitThumb[def.id]; inn.appendChild(img); }
    else inn.innerHTML='<svg viewBox="0 0 100 100"><path d="M26 18h48L54 50l20 32H26l20-32z" fill="#39ff8a"/><path d="M34 24h32L50 46z M34 76h32L50 54z" fill="#03130c"/></svg>';
    const b=document.createElement('b'); b.textContent=DIAL_SHORT[def.id]||def.name; inn.appendChild(b);
    const pick=e=>{ e.preventDefault(); e.stopPropagation(); Audio_.resume(); if(tryTransform(def)) closeDial(); };
    el.addEventListener('touchstart',e=>e.stopPropagation(),{passive:true});

}
function syncDial(){
  const d=document.getElementById('omni-dial');
  [...d.children].forEach(el=>{
    const isBen=el.dataset.id==='ben', cur=el.dataset.id===player.form.id;
    el.classList.toggle('cur',cur);
    el.classList.toggle('off',!cur && !isBen && OMNI.enabled && (OMNI.lock>0||OMNI.charge<OMNI_MIN));
    const inn=el.firstChild, img=inn&&inn.firstChild; if(img && img.tagName==='IMG' && !img.getAttribute('src') && portraitThumb[el.dataset.id]) img.src=portraitThumb[el.dataset.id];
  });
}
function openDial(){
  if(!player.alive||player.driving) return;
  const d=document.getElementById('omni-dial'); if(!d.children.length) buildDial();
  d.style.setProperty('--ds',String(Math.max(.55,Math.min(1,(window.innerHeight-36)/300))));

  d.classList.add('show'); document.getElementById('omni-dim').classList.add('show'); document.getElementById('omni-x').classList.add('show');
  syncDial(); Audio_.click();
}
function closeDial(){ OMNI.open=false; ['omni-dial','omni-dim','omni-x'].forEach(id=>document.getElementById(id).classList.remove('show')); }
function toggleDial(){ if(OMNI.open) closeDial(); else openDial(); }
(function(){ const close=e=>{ e.preventDefault(); e.stopPropagation(); closeDial(); };
  ['omni-dim','omni-x'].forEach(id=>{ const el=document.getElementById(id); el.addEventListener('touchend',close,{passive:false}); el.addEventListener('click',close); }); })();
function warmPortraits(){ // render every portrait once, a little at a time, so the dial never hitches
  const kinds=['ben'].concat(ALIENS.map(a=>a.id)); let i=0;

/* =========================================================================
   CAMERA CONTROLLER (third person)
========================================================================= */
const CHAR_SCALE = 1.35;             // one knob for character size: player, replicas, enemies (NPCs use NPC_SCALE)
const NPC_SCALE  = 1.05;
const PS = 0.55*CHAR_SCALE; // player model scale
const camState = { dist:4.2*CHAR_SCALE, height:1.1*CHAR_SCALE };
const camDyn={px:0,pz:0,vx:0,vz:0,t:0,init:false,kick:0,wasGround:true,lastVy:0};
function updateCamera(){
  const nowT=performance.now(); const cdt=camDyn.t?Math.min(.05,(nowT-camDyn.t)/1000):0; camDyn.t=nowT;
  // smoothed horizontal velocity (works for walking, flying, XLR8 and driving alike)
  if(camDyn.init && cdt>0){ const vx=(player.pos.x-camDyn.px)/cdt, vz=(player.pos.z-camDyn.pz)/cdt;
    if(Math.hypot(vx,vz)<90){ const k=Math.min(1,cdt*4.5); camDyn.vx+=(vx-camDyn.vx)*k; camDyn.vz+=(vz-camDyn.vz)*k; } else { camDyn.vx=camDyn.vz=0; } }
  camDyn.px=player.pos.x; camDyn.pz=player.pos.z; camDyn.init=true;
  // landing: brief downward dip scaled by how hard we hit
  if(!player.onGround) camDyn.lastVy=player.vel.y;
  else if(!camDyn.wasGround && camDyn.lastVy<-8 && !player.driving) camDyn.kick=Math.min(.5,(-camDyn.lastVy-6)*.022);
  camDyn.wasGround=player.onGround; camDyn.kick*=Math.max(0,1-cdt*7);
  const lookDir = new THREE.Vector3(
    Math.cos(player.pitch) * -Math.sin(player.yaw),
    Math.sin(player.pitch),
    Math.cos(player.pitch) * -Math.cos(player.yaw)
  );
  const drv = player.driving ? 1 : 0;
  const la=Math.min(.16, .028+ (drv?.02:0)); // seconds of look-ahead
  const pivot = player.pos.clone().add(new THREE.Vector3(camDyn.vx*la, camState.height + drv*0.6 - camDyn.kick, camDyn.vz*la));
  const desired = pivot.clone().addScaledVector(lookDir, -(camState.dist + drv*3.6));
  camera.position.lerp(desired, 0.18);
  const lookAt = pivot.clone().addScaledVector(lookDir, 8);
  camera.lookAt(lookAt);
}

/* =========================================================================
   PROJECTILES
========================================================================= */
const projectiles = [];
function spawnProjectile(pl, color, damage, speed, pierce, style, opts){
  const geo=style==='crystal'?new THREE.OctahedronGeometry(0.3):new THREE.SphereGeometry(style==='fire'?0.5:0.22,8,8);
  const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color}));
  if(style==='crystal') mesh.scale.set(.7,1.7,.7);
  if(style==='fire') mesh.add(new THREE.Mesh(new THREE.SphereGeometry(.28,8,8),new THREE.MeshBasicMaterial({color:0xffe27a})));
  let dir, startPos;
  if(opts && opts.explicitDir){
    // Enemy-fired: aim directly at a world-space target point rather than deriving direction from
    // a yaw/pitch pair, since enemies don't have a look-pitch the way the player does.
    dir = opts.explicitDir.clone().normalize();
    startPos = opts.explicitFrom ? opts.explicitFrom.clone() : pl.pos.clone().add(new THREE.Vector3(0,1.2,0));
  } else {
    const cp=Math.cos(pl.pitch||0);
    dir = new THREE.Vector3(-Math.sin(pl.yaw)*cp, Math.sin(pl.pitch||0), -Math.cos(pl.yaw)*cp);
    startPos = pl.pos.clone().add(new THREE.Vector3(0,1.2,0)).add(dir.clone().multiplyScalar(1.2));
  }
  mesh.position.copy(startPos);
  scene.add(mesh);
  projectiles.push({mesh, dir, speed, damage, pierce, style, life:2.2, hitSet:new Set(), hostile: !!(opts && opts.hostile)});
  Audio_.special();
}
function updateProjectiles(dt){
  for(let i=projectiles.length-1;i>=0;i--){
    const p = projectiles[i];
    p.mesh.position.addScaledVector(p.dir, p.speed*dt);
    p.life -= dt;
    let dead = p.life<=0;
    const pp=p.mesh.position;
    if(pp.y<groundTopAt(pp.x,pp.z)||blockedAt(pp.x,pp.z,pp.y-0.5)) dead=true;
    if(p.style==='fire'){ for(let k=0;k<2;k++) debris(pp.clone().add(new THREE.Vector3((Math.random()-.5)*.3,(Math.random()-.5)*.3,(Math.random()-.5)*.3)),Math.random()<.5?0xff5a1e:0xffd84a,.4+Math.random()*.3,new THREE.Vector3(0,1.2,0),.45,false); p.mesh.scale.setScalar(1+Math.sin(p.life*30)*.12); }
    else if(p.style==='crystal') p.mesh.rotation.y+=dt*10;
    if(!p.hostile){ for(const pr of props){ if(!pr.veh||pr.driver||pr.wreck||p.hitSet.has(pr)) continue;
      const q=pr.mesh.position; if(Math.abs(pp.y-q.y)<1.6 && Math.hypot(pp.x-q.x,pp.z-q.z)<2.0){ p.hitSet.add(pr); vehicleHit(pr,p.dir,p.damage*.8,p.style==='fire'?5:3,p.style==='fire'?'fire':'punch'); dead=true; } } }
    if(p.hostile){
      // Enemy-fired projectile: can hit the player or whichever squad unit (Echo Echo replica) is nearest its current position.
      const tu = nearestTarget(pp);
      if(pp.distanceTo(tu.pos) < 1.0){
        hurtTarget(tu, p.damage);
        dead = true;
      }
    } else {
      for(const en of enemies){
        if(!en.alive || p.hitSet.has(en)) continue;
        if(p.mesh.position.distanceTo(en.mesh.position) < 1.0){
          damageEnemy(en, p.damage, p.dir);
          p.hitSet.add(en);
          if(!p.pierce) dead = true;
        }
      }
    }
    if(dead){ if(p.style==='fire') for(let k=0;k<8;k++) debris(p.mesh.position.clone(),Math.random()<.5?0xff5a1e:0xffd84a,.5,new THREE.Vector3((Math.random()-.5)*6,Math.random()*5,(Math.random()-.5)*6),.6,false); scene.remove(p.mesh); projectiles.splice(i,1); }
  }
}

let camShake = 0;

function shockwaveAt(center, radius, damage, knock){
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.2,0.4,24), new THREE.MeshBasicMaterial({color:0xffffff, side:THREE.DoubleSide, transparent:true, opacity:0.8}));
  ring.rotation.x = -Math.PI/2; ring.position.copy(center); ring.position.y += 0.05;
  scene.add(ring);
  let t=0;
  (function grow(){
    t += 0.03; ring.scale.setScalar(1 + t*radius*3); ring.material.opacity = Math.max(0,0.8-t*2);
    if(t<0.5) requestAnimationFrame(grow); else scene.remove(ring);
  })();
  enemies.forEach(en=>{
    if(!en.alive) return;
    const d = en.mesh.position.distanceTo(center);
    if(d < radius){
      damageEnemy(en, damage, en.mesh.position.clone().sub(center).normalize());
    }
  });
}
function trackingPulse(){
  enemies.forEach(en=>{
    if(!en.alive) return;
    const d = en.mesh.position.distanceTo(player.pos);
    if(d < 14){
      const glow = new THREE.PointLight(0xffaa00, 1.2, 4);
      glow.position.set(0,1.4,0); en.mesh.add(glow);
      setTimeout(()=>en.mesh.remove(glow), 3000);
    }
  });
  statusText('TRACKING SENSE ACTIVE');
}

function makeEnemy(type, x, z, y0){
  const stats = ENEMY_STATS[type] || ENEMY_STATS.normal;
  const y = y0!==undefined ? y0 : groundTopAt(x,z);
  const look=Object.assign({},ENEMY_LOOK[type]||ENEMY_LOOK.normal,{top:stats.color,sleeve:true});
  const R=buildRig(look), parts=R.parts;
  const k=(stats.yOff*2)/parts.dims.total;
  R.g.scale.setScalar(k); R.g.position.y=-stats.yOff;
  if(type==='ranged'||type==='elite'){ const gun=new THREE.Mesh(UB,rigMat(0x1c1c22)); gun.scale.set(.12,.46,.15); gun.position.set(0,-parts.dims.armLen*.5-.16,0); parts.elbowR.add(gun); parts.all.push(gun.material); }
  if(type==='elite'){ const v=new THREE.Mesh(UB,rigMat(0xff3030)); v.scale.set(parts.dims.headS*.9,.1,.05); v.position.set(0,parts.dims.headS*.58,-parts.dims.headS/2-.02); parts.head.add(v); parts.all.push(v.material); }

  const spin=new THREE.Group(); spin.rotation.y=Math.PI; spin.add(R.g); // the rig faces -Z; lookAt() aims +Z
  const body=new THREE.Group(); body.add(spin);

// --- enemy animation helpers ---
const _wd=new THREE.Vector3();
function enemySwing(en,kind,dur,tc){ if(kind==='light'){ en.swSide=!en.swSide; kind=en.swSide?'right':'left'; } en.swing={kind,dur,left:dur,tc:tc||.3}; }
function animateEnemies(dt){
  for(let i=0;i<enemies.length;i++){
    const en=enemies[i]; if(en.npc||!en.alive||en.ice||!en.parts) continue;
    const p=en.mesh.position; if(Math.abs(p.x-player.pos.x)>60||Math.abs(p.z-player.pos.z)>60) continue; // asleep
    const stats=ENEMY_STATS[en.type]||ENEMY_STATS.normal;
    en.mesh.getWorldDirection(_wd);
    // wandering enemies turn to face where they walk (chase/retreat use lookAt in the AI)
    const px=en.parts.anim.px, pz=en.parts.anim.pz;
    if(en.state==='wander' && px!==null){ const vx=p.x-px, vz=p.z-pz; if(vx*vx+vz*vz>1e-5){ const want=Math.atan2(vx,vz); let cur=Math.atan2(_wd.x,_wd.z), d=want-cur; d=Math.atan2(Math.sin(d),Math.cos(d)); en.mesh.rotation.set(0,cur+d*Math.min(1,dt*8),0); en.mesh.getWorldDirection(_wd); } }

// Death: the body stays in the world, crumples backwards along the hit direction, then clears.
const dyingRigs=[];
function startEnemyDeath(en,dir){
  const mesh=en.mesh; if(!mesh) return; rigFlash(en.parts,false);
  const st=ENEMY_STATS[en.type]||ENEMY_STATS.normal;
  dyingRigs.push({mesh,parts:en.parts,spin:en.spin,t:0,vx:dir?dir.x*3.4:0,vz:dir?dir.z*3.4:0,yOff:st.yOff});
}
function updateDyingRigs(dt){
  for(let i=dyingRigs.length-1;i>=0;i--){
    const d=dyingRigs[i]; d.t+=dt; const k=Math.min(1,d.t/.55), m=d.mesh.position;
    d.spin.rotation.x=-1.45*_eo(k);
    animateRig(d.parts,dt,{dead:k,grounded:true,ws:.5});
    const nx=m.x+d.vx*dt, nz=m.z+d.vz*dt; if(!blockedAt(nx,m.z,m.y-d.yOff)) m.x=nx; if(!blockedAt(m.x,nz,m.y-d.yOff)) m.z=nz; d.vx*=Math.max(0,1-dt*5); d.vz*=Math.max(0,1-dt*5);

// Maintains a small population of enemies near the player, mixing all 5 archetypes. Capped low and
// distance-gated (like the NPC spawner already does for civilians/gangs) so this stays cheap on mobile -
// we are not spawning hundreds of enemies at once, just enough to keep encounters happening nearby.
const ENEMY_TYPE_WEIGHTS = [['normal',5],['ranged',2],['brute',2],['speed',2],['elite',1]];
function pickEnemyType(){
  const total = ENEMY_TYPE_WEIGHTS.reduce((s,[,w])=>s+w,0);
  let r = Math.random()*total;
  for(const [type,w] of ENEMY_TYPE_WEIGHTS){ if(r<w) return type; r-=w; }
  return 'normal';

// Enemies stand on whatever surface is under them (rooftops, landings, ramps) and drop down when they walk off.
function enemyGroundY(en,yOff,dt){
  const p=en.mesh.position, feet=p.y-yOff, sf=groundTopAt(p.x,p.z,feet+0.05);

// A rooftop within reach of the player (12-38 units away) to ambush from, so rooftops become fighting spaces.
function roofSpawnPoint(){
  const cc=chunkCoordOf(player.pos.x,player.pos.z), cand=[];

    const ch=chunks.get(chunkKeyOf(cc[0]+dx,cc[1]+dz)); if(!ch||!ch.props.roofSpots) continue;
    ch.props.roofSpots.forEach(q=>{ const d=Math.hypot(q[0]-player.pos.x,q[1]-player.pos.z); if(d>18&&d<38&&!blockedAt(q[0],q[1],q[2])) cand.push(q); });

  if(n>=(ranged?ATK_SLOTS_RANGED:ATK_SLOTS_MELEE)) return false;
  en.slotT=hold; en.slotRanged=!!ranged; en.slotCd=hold+1.4+Math.random()*.8; en.windT=.4+Math.random()*.35; // short telegraph before the first swing

const MAX_ENEMIES_BY_Q={LOW:3,MEDIUM:5,HIGH:6};
let enemySpawnT = 0;
function updateEnemySpawning(dt){
  enemySpawnT -= dt;
  if(enemySpawnT > 0) return;
  enemySpawnT = 6;
  const active = enemies.filter(e=>!e.npc && e.alive).length;
  if(active >= (MAX_ENEMIES_BY_Q[QUALITY.level]||5)) return;
  // never pile more enemies into a fight that is already happening
  if(enemies.some(e=>!e.npc&&e.alive&&e.state==='chase'&&e.mesh.position.distanceTo(player.pos)<16)) return;

  // to matter, and never inside a solid block.
  if(Math.random()<0.3){ // ~1 in 3 spawns is an ambusher on a nearby rooftop (only the weaker archetypes)
    const rs=roofSpawnPoint();
    if(rs){ makeEnemy(Math.random()<0.6?'ranged':'normal', rs[0], rs[1], rs[2]); return; }
  }
  for(let tries=0; tries<6; tries++){
    const ang = Math.random()*Math.PI*2, dist = 28 + Math.random()*20;
    const x = Math.round(player.pos.x + Math.cos(ang)*dist), z = Math.round(player.pos.z + Math.sin(ang)*dist);

  }
}

function damageEnemy(en, dmg, dirAway, opts){
  if(!en.alive) return;
  if(en.npc){ npcHurt(en,dmg,dirAway,opts); return; }
  en.hp -= dmg;
  const heavy = opts && opts.heavy;
  rigFlash(en.parts,true); en.hurtT=heavy?.5:.28; const _pp=en.parts; setTimeout(()=>rigFlash(_pp,false), heavy?200:120);

    const knock = (opts && opts.knock!=null) ? opts.knock : 3;

    en.knockVel.set(dirAway.x*knock, 0, dirAway.z*knock);

  }
  if(heavy) Audio_.heavyHit(); else Audio_.hit();

    en.alive = false;
    if(lock.en===en) setLock(null); // never let a lock survive onto a recycled enemy object
    startEnemyDeath(en, dirAway);

      const ra=Math.random()*6.283, rd=32+Math.random()*16;
      const x = Math.round(player.pos.x + Math.cos(ra)*rd);
      const z = Math.round(player.pos.z + Math.sin(ra)*rd);

function updateEnemies(dt){
  enemies.forEach(en=>{
    if(!en.alive||en.npc) return;
    if(en.ice) return;
    const p = en.mesh.position;
    if(en.slotT>0) en.slotT-=dt; if(en.slotCd>0) en.slotCd-=dt; if(en.windT>0) en.windT-=dt;

    // Distance-based sleep: enemies far from the player skip almost all logic (no target search, no
    // movement, no attack timers), so a large world with many enemies stays cheap. They still tick
    // down staggerT/atkCd minimally so nothing feels frozen the instant they wake up.
    const distFromPlayer = p.distanceTo(player.pos);
    if(distFromPlayer > 45){
      en.staggerT = Math.max(0, (en.staggerT||0) - dt);

    }

      if(!blockedAt(nx, p.z, p.y-0.5)) p.x = nx;

    }
    const stats = ENEMY_STATS[en.type] || ENEMY_STATS.normal;
    en.staggerT = Math.max(0, (en.staggerT||0) - dt);
    if(en.staggerT > 0){ p.y = enemyGroundY(en,stats.yOff,dt); return; } // hit-reaction pause: skip normal AI this frame

    en.alertedT = Math.max(0, (en.alertedT||0) - dt);

    // and re-evaluates every frame - so if the current target dies or a replica is removed, the very
    // next frame naturally retargets without any extra bookkeeping needed here.
    const tu=nearestTarget(p), tpos=tu.pos, distToTarget=p.distanceTo(tpos);
    en.atkCd = Math.max(0, en.atkCd - dt);

    const inChaseRange = distToTarget < stats.chaseRange || en.alertedT > 0;
    const lostRange = distToTarget > stats.loseRange;
    const hpFrac = en.hp / en.maxHp;
    const shouldRetreat = stats.retreatHpFrac > 0 && hpFrac <= stats.retreatHpFrac;

    if(shouldRetreat){ en.state = 'retreat'; }
    else if(inChaseRange){ en.state = 'chase'; }
    else if(lostRange){ en.state = 'wander'; }

        if(!blockedAt(nx,p.z,p.y-0.5)) p.x=nx; if(!blockedAt(p.x,nz,p.y-0.5)) p.z=nz; }

        } else if(dist < pref - 1.5){

      } else {

}

function flashDamage(){
  player.hurtT=.35;
  const el = document.getElementById('damage-overlay');
  el.style.boxShadow = 'inset 0 0 140px 30px rgba(255,0,0,0.55)';
  setTimeout(()=> el.style.boxShadow = 'inset 0 0 120px 20px rgba(255,0,0,0)', 200);
}

/* =========================================================================
   ATTACK (melee) + BLOCK BREAK/PLACE (shared crosshair raycast)
========================================================================= */
/* PROPS / ACTIONS / FX */

/* =========================================================================
   STAGE 6 — LOCK-ON (optional target lock; never mandatory)
   One shared target reference. Everything that needs "where should I aim?" asks lockAim()/lockedTarget()
   so melee, abilities, Sonic Doom and the XLR8 tackle all agree. Free camera swipes always win.
========================================================================= */
const LOCK_PICK_PX = 70;      // tap must land within this many screen px of a target's projected point
const LOCK_MAX_DIST = 34;     // can only acquire targets this close
const LOCK_BREAK_DIST = 44;   // auto-unlock beyond this (hysteresis > acquire distance)
const lock = { en:null, assistHold:0, popT:0 };
const _lv = new THREE.Vector3();
function lockValid(en){
  if(!en || !en.alive || en.state==='dead' || !en.mesh || !en.mesh.parent) return false;
  if(enemies.indexOf(en)<0) return false;
  return en.mesh.position.distanceTo(player.pos) <= LOCK_BREAK_DIST;
}
function lockedTarget(){ return lockValid(lock.en) ? lock.en : null; }
function lockCenter(en, out){ // chest-height aim point of a target
  out = out || new THREE.Vector3(); out.copy(en.mesh.position);
  out.y += en.npc ? 0.2 : 0.1; return out;
}
function setLock(en){
  if(lock.en===en) return;
  lock.en = en||null; lock.assistHold = 0;
  const mk=document.getElementById('lock-marker');
  if(en){
    lock.popT = 0.28; mk.classList.remove('pop'); void mk.offsetWidth; mk.classList.add('pop');
    const nm = en.npc ? (en.gang ? en.gang.name+' GANG' : 'CIVILIAN') : (en.type||'enemy').toUpperCase();
    document.getElementById('lock-name').textContent = nm;
    statusText('TARGET LOCKED'); Audio_.hit();
  } else { mk.style.display='none'; }
  const b=document.getElementById('lock-btn'); if(b) b.classList.toggle('on', !!en);
}
function unlockTarget(msg){ if(lock.en){ setLock(null); if(msg) statusText(msg); } }
// Screen-space pick: nearest projected target to the tap point. Forgiving on phones (fingers are big) and
// independent of mesh type (NPCs are Groups, enemies are Boxes).
function pickEnemyAtScreen(px, py){
  const w=innerWidth, h=innerHeight; let best=null, bd=1e9;
  for(let i=0;i<enemies.length;i++){
    const en=enemies[i]; if(!en.alive||en.state==='dead'||!en.mesh.parent) continue;
    const dist=en.mesh.position.distanceTo(player.pos); if(dist>LOCK_MAX_DIST) continue;
    lockCenter(en,_lv).project(camera);
    if(_lv.z>1||_lv.z<-1) continue; // behind camera / clipped
    const sx=(_lv.x*0.5+0.5)*w, sy=(-_lv.y*0.5+0.5)*h;
    const d=Math.hypot(sx-px, sy-py);
    const reach = LOCK_PICK_PX * (1 + Math.max(0,(12-dist))*0.012); // slightly more forgiving up close
    if(d<reach && d<bd){ bd=d; best=en; }
  }
  return best;
}
function tapLock(px,py){
  const hit=pickEnemyAtScreen(px,py);
  if(!hit) return false;
  if(lock.en===hit) unlockTarget('TARGET RELEASED'); else setLock(hit);
  return true;
}
// Button: lock nearest in front, or release if already locked.
function lockButton(){
  if(!player.alive) return;
  if(lockedTarget()){ unlockTarget('TARGET RELEASED'); return; }
  const f=flatFwd(player.yaw); let best=null, bs=1e9;
  enemies.forEach(en=>{
    if(!en.alive||en.state==='dead') return;
    const v=en.mesh.position.clone().sub(player.pos); v.y=0; const d=v.length(); if(d>LOCK_MAX_DIST||d<0.01) return;
    const ang=f.angleTo(v.normalize()); const score=d*(1+ang*1.2); // prefer close AND centred
    if(ang<1.9 && score<bs){ bs=score; best=en; }
  });
  if(best) setLock(best); else statusText('NO TARGET');
}
// Direction helpers other systems use. Return null when nothing is locked so callers keep their old behaviour.
function lockDirFrom(from){
  const t=lockedTarget(); if(!t) return null;
  const d=t.mesh.position.clone().sub(from); d.y=0; if(d.lengthSq()<0.0001) return null; return d.normalize();
}
// Face the locked target instantly (used at attack start). Only when it is roughly in front / close, so a
// stray lock on something behind you doesn't spin you around mid-run.
function faceLockedTarget(maxDist, maxAng){
  const t=lockedTarget(); if(!t) return false;
  const d=lockDirFrom(player.pos); if(!d) return false;
  const dist=t.mesh.position.distanceTo(player.pos); if(dist>maxDist) return false;
  const f=flatFwd(player.yaw); if(f.angleTo(d)>(maxAng||2.2)) return false;
  player.yaw=Math.atan2(-d.x,-d.z); return true;
}
// Snap yaw AND pitch at the locked target (used when firing an ability so shots go where the lock is).
function aimAtLock(){
  const t=lockedTarget(); if(!t) return false;
  const to=lockCenter(t,_lv).clone().sub(player.pos.clone().add(new THREE.Vector3(0,1.0,0)));

const BASE_FOV = 70, MAX_FOV_BOOST = 30;
const STREAK_COUNT = 14, DUST_COUNT = 12;
const streakGeo = new THREE.BoxGeometry(0.04, 0.04, 1);
const streakMat = new THREE.MeshBasicMaterial({color:0xbfe8ff, transparent:true, opacity:0, depthWrite:false});
const streaks = [];
for(let i=0;i<STREAK_COUNT;i++){
  const m = new THREE.Mesh(streakGeo, streakMat.clone());
  m.visible = false; m.frustumCulled = false; scene.add(m);
  streaks.push({mesh:m, seed:Math.random(), idx:i});
}
const dustGeo = new THREE.BoxGeometry(1,1,1);
const dustPuffs = [];
for(let i=0;i<DUST_COUNT;i++){
  const m = new THREE.Mesh(dustGeo, new THREE.MeshBasicMaterial({color:0xd8cdb0, transparent:true, opacity:0, depthWrite:false}));
  m.visible = false; m.frustumCulled = false; scene.add(m);
  dustPuffs.push({mesh:m, life:0, max:0.5});
}
let dustIdx = 0, dustEmitAcc = 0, lastFov = BASE_FOV, speedShakeT = 0;

function updateSpeedEffects(dt){
  const s = player.form.id==='xlr8' ? (player.superSpeed||0) : 0;

  // FOV widens with speed; only touch the projection matrix when the value actually changed.
  const targetFov = BASE_FOV + MAX_FOV_BOOST*s + (player.driving ? MAX_FOV_BOOST*0.45*Math.min(1,Math.abs(player.driving.v)/CAR_MAX_FWD) : 0);
  const newFov = lastFov + (targetFov-lastFov)*Math.min(1, dt*6);
  if(Math.abs(newFov-lastFov) > 0.02){ lastFov = newFov; camera.fov = newFov; camera.updateProjectionMatrix(); }

  // Speed streaks: thin lines around the camera, stretched along the travel direction and sliding past.
  const showStreaks = s > 0.25;
  const fwd = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  for(const st of streaks){
    if(!showStreaks){ if(st.mesh.visible){ st.mesh.visible=false; st.mesh.material.opacity=0; } continue; }
    st.mesh.visible = true;
    // Each streak drifts backward past the player and wraps to the front when it passes behind.
    st.seed = (st.seed + dt*(1.2 + s*3.5)) % 1;
    const ang = (st.seed*7.3 + st.idx*0.9) % (Math.PI*2);
    const radius = 1.6 + ((st.idx*0.37)%1)*2.2;
    const along = 10 - st.seed*20; // +10 ahead ... -10 behind
    const side = new THREE.Vector3(fwd.z, 0, -fwd.x);
    st.mesh.position.copy(player.pos)
      .addScaledVector(fwd, along)
      .addScaledVector(side, Math.cos(ang)*radius)
      .add(new THREE.Vector3(0, 1 + Math.sin(ang)*radius*0.7, 0));
    st.mesh.rotation.y = player.yaw;
    st.mesh.scale.z = 1.5 + s*6; // longer streaks at higher speed
    st.mesh.material.opacity = Math.min(0.55, (s-0.25)*0.9);
  }

  // Ground dust trail: emit puffs at the feet at a rate scaled by speed, only while grounded.
  if(s > 0.15 && player.onGround && !player.flying && !player.swimming){
    dustEmitAcc += dt*(6 + s*22);
    while(dustEmitAcc >= 1){
      dustEmitAcc -= 1;
      const d = dustPuffs[dustIdx]; dustIdx = (dustIdx+1)%DUST_COUNT;
      d.life = d.max = 0.35 + Math.random()*0.25;
      d.mesh.visible = true;
      d.mesh.position.set(player.pos.x + (Math.random()-0.5)*0.6, groundTopAt(player.pos.x,player.pos.z,player.pos.y-1)+0.15, player.pos.z + (Math.random()-0.5)*0.6);
      d.mesh.scale.setScalar(0.25 + s*0.35);
    }
  }
  for(const d of dustPuffs){
    if(d.life <= 0){ if(d.mesh.visible) d.mesh.visible=false; continue; }
    d.life -= dt;
    const k = Math.max(0, d.life/d.max);
    d.mesh.material.opacity = k*0.55;
    d.mesh.scale.multiplyScalar(1 + dt*2.2);
    d.mesh.position.y += dt*0.4;
  }

  // Continuous camera shake at extreme speed (separate from the one-shot shakeCamera used by impacts).
  if(s > 0.75){
    speedShakeT = (s-0.75)*0.16;
    camera.position.x += (Math.random()-0.5)*speedShakeT;
    camera.position.y += (Math.random()-0.5)*speedShakeT;
  }
}
